<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
</marker>
</defs>
<rect width="720" height="700" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="700" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Anchor scope</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Scope compares the length of rode to the height from bow roller to sea bed.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="10" y="265" width="710" height="215" fill="url(#seaG)" opacity="0.85"/>
<line x1="10.0" y1="265.0" x2="720.0" y2="265.0" stroke="#0e7490" stroke-width="2.5" stroke-linecap="butt"/>
<rect x="10" y="480" width="710" height="40" fill="#d6c7a1"/>
<line x1="10.0" y1="480.0" x2="720.0" y2="480.0" stroke="#a8956a" stroke-width="2" stroke-linecap="butt"/>
<path d="M440,200 Q520,222 660,228 L662,279 Q600,295 520,293 Q478,287 470,265 Z" fill="#ffffff" stroke="#102a43" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="575,225 585,212 645,212 645,227" fill="#e2e8f0" stroke="#102a43" stroke-width="2"/>
<circle cx="440" cy="200" r="6" fill="#102a43"/>
<path d="M440,200 C330,330 380,476 300,477" fill="none" stroke="#a16207" stroke-width="4"/>
<line x1="300.0" y1="477.0" x2="154.0" y2="477.0" stroke="#334155" stroke-width="5" stroke-linecap="butt" stroke-dasharray="7 3"/>
<path d="M154,477 L110,477 M120,477 L98,454 M120,477 L138,456" fill="none" stroke="#102a43" stroke-width="5" stroke-linecap="round"/>
<text x="120.0" y="510.0" font-size="17" text-anchor="middle" fill="#5b4a26" font-weight="bold" font-family="Liberation Sans">Anchor</text>
<text x="220.0" y="466.0" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Chain</text>
<text x="200.0" y="360.0" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Length of rode</text>
<line x1="268.0" y1="368.0" x2="338.0" y2="392.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
<line x1="450.0" y1="200.0" x2="698.0" y2="200.0" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="690.0" y1="203.0" x2="690.0" y2="262.0" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/>
<line x1="690.0" y1="268.0" x2="690.0" y2="477.0" stroke="#102a43" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="696.0" y="188.0" font-size="17" text-anchor="end" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">Bow height</text>
<text x="676.0" y="380.0" font-size="18" text-anchor="end" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Depth</text>
<text x="676.0" y="402.0" font-size="16" text-anchor="end" fill="#ffffff" font-weight="normal" font-family="Liberation Sans">(at high water)</text>
<text x="426.0" y="188.0" font-size="16" text-anchor="end" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Bow roller</text>
<rect x="40" y="545" width="640" height="100" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<text x="60.0" y="577.0" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Scope = length of rode ÷ (depth + bow height)</text>
<text x="60.0" y="607.0" font-size="18" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">Usually 5 to 7 times, with chain or a chain leader.</text>
<text x="60.0" y="631.0" font-size="16" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Work out depth at high water: allow for the tide to rise.</text>
<text x="360.0" y="676.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
