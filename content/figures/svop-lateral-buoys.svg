<text x="515" y="706" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">going upstream</text>
<text x="360" y="752" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
