<text x="515" y="568" font-size="17" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Red</text>
<text x="515" y="596" font-size="17" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Cone (nun)</text>
