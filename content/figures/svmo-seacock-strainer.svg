<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" width="720" height="660" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="freshG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#1d4e89"/>
</linearGradient>
<linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
</linearGradient>
<linearGradient id="thin" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#292524"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/>
</linearGradient>
</defs>
<rect width="720" height="660" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="660" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Seacock and strainer</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Every hull opening has a valve you can reach.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="0" y="360" width="720" height="250" fill="#e0f2fe"/>
<path d="M0 360 Q180 340 360 360 T720 360" fill="none" stroke="#0e7490" stroke-width="3"/>
<text x="80.0" y="340.0" font-size="16" text-anchor="start" fill="#0e7490" font-weight="bold" font-family="Liberation Sans">Waterline</text>
<rect x="180" y="300" width="28" height="220" fill="#cbd5e1" stroke="#475569"/>
<text x="194.0" y="280.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Hull</text>
<rect x="230" y="360" width="140" height="90" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="250" y="330" width="14" height="50" fill="#0f766e"/>
<rect x="230" y="318" width="54" height="14" rx="4" fill="#134e4a"/>
<text x="300.0" y="412.0" font-size="20" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Seacock</text>
<line x1="370.0" y1="405.0" x2="407.0" y2="405.0" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round"/><polygon points="420.0,405.0 407.0,398.5 407.0,411.5" fill="#0f766e"/>
<rect x="420" y="340" width="220" height="140" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="500" y="370" width="70" height="80" rx="8" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 4"/>
<text x="530.0" y="430.0" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Basket</text>
<text x="530.0" y="510.0" font-size="20" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Strainer</text>
<text x="360.0" y="560.0" font-size="20" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">Close the seacock before you open the strainer.</text>
<text x="360.0" y="592.0" font-size="16" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Then open it again and check for leaks.</text>
<text x="360.0" y="632.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
</svg>