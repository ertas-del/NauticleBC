<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 808" width="720" height="808" role="img">
<title>Fuel and a trip plan</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/></filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahn" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102a43"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="720" height="808" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="808" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Fuel and a trip plan</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Plan the fuel in thirds, and leave word with someone ashore.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="40" y="136" font-size="19" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">The rule of thirds for fuel</text>
<rect x="40" y="154" width="640" height="70" rx="14" fill="#ffffff" filter="url(#s)"/>
<rect x="48" y="162" width="201" height="54" rx="10" fill="#0f766e"/>
<text x="149" y="198" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">1/3 out</text>
<rect x="259" y="162" width="201" height="54" rx="10" fill="#2563eb"/>
<text x="360" y="198" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">1/3 back</text>
<rect x="471" y="162" width="201" height="54" rx="10" fill="#d97706"/>
<text x="571" y="198" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">1/3 reserve</text>
<text x="40" y="254" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">Allow extra for wind, tide and weather.</text>
<text x="40" y="278" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">Check the fuel level by sounding or gauge, not by guess.</text>
<text x="40" y="324" font-size="19" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Leave a trip plan with someone ashore</text>
<rect x="40" y="340" width="400" height="318" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="40" y="340" width="400" height="44" rx="12" fill="#102a43"/>
<rect x="40" y="368" width="400" height="16" fill="#102a43"/>
<text x="60" y="369" font-size="18" text-anchor="start" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">TRIP PLAN</text>
<text x="60" y="414" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Vessel</text>
<text x="60" y="435" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">name, description, registration</text>
<line x1="60" y1="448" x2="420" y2="448" stroke="#e4e7eb" stroke-width="1"/>
<text x="60" y="464" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">People</text>
<text x="60" y="485" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">how many, and contact details</text>
<line x1="60" y1="498" x2="420" y2="498" stroke="#e4e7eb" stroke-width="1"/>
<text x="60" y="514" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Route</text>
<text x="60" y="535" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">where you go, and destination</text>
<line x1="60" y1="548" x2="420" y2="548" stroke="#e4e7eb" stroke-width="1"/>
<text x="60" y="564" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Back by</text>
<text x="60" y="585" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">expected return time</text>
<line x1="60" y1="598" x2="420" y2="598" stroke="#e4e7eb" stroke-width="1"/>
<text x="60" y="614" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Contact</text>
<text x="60" y="635" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">who raises the alarm if you are late</text>
<rect x="464" y="340" width="216" height="84" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="492" cy="370" r="14" fill="#0f766e"/>
<text x="492" y="376" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">1</text>
<text x="516" y="376" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Leave the plan</text>
<text x="484" y="406" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">with a person or office</text>
<line x1="572" y1="429" x2="572" y2="452" stroke="#52606d" stroke-width="2.5" marker-end="url(#ahg)"/>
<rect x="464" y="457" width="216" height="84" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="492" cy="487" r="14" fill="#2563eb"/>
<text x="492" y="493" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">2</text>
<text x="516" y="493" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Go</text>
<text x="484" y="523" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">keep to the route</text>
<line x1="572" y1="546" x2="572" y2="569" stroke="#52606d" stroke-width="2.5" marker-end="url(#ahg)"/>
<rect x="464" y="574" width="216" height="84" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="492" cy="604" r="14" fill="#dc2626"/>
<text x="492" y="610" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">3</text>
<text x="516" y="610" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Back? Tell them</text>
<text x="484" y="640" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">or they may call a search</text>
<rect x="40" y="682" width="640" height="78" rx="12" fill="#fffbeb" stroke="#f5d48a" stroke-width="2"/>
<text x="60" y="712" font-size="16" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Gasoline inboard? Run the blower at least 4 minutes, then sniff.</text>
<text x="60" y="738" font-size="15" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">Check the forecast, the tides and the local hazards before you go.</text>
<text x="360" y="790" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
