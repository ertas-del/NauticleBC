<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" role="img">
<title>Young drivers: power limits</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
</marker>
<marker id="ahd" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
</marker>
<linearGradient id="nightP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d36"/><stop offset="1" stop-color="#12294a"/></linearGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>

</defs>
<rect width="720" height="800" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="800" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Young drivers: power limits</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Limits on engine power for drivers under 16 with no direct supervision.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>

<rect x="40" y="116" width="640" height="34" rx="8" fill="#0f766e"/><text x="56" y="139" font-size="18" text-anchor="start" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Driving a motor boat without direct supervision</text>
<rect x="40" y="164" width="640" height="96" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="58" y="182" width="168" height="60" rx="30" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
<text x="142" y="220" font-size="22" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Under 12</text>
<rect x="278.5" y="201.0" width="5.0" height="7.7" rx="1.1" fill="#829ab1"/><rect x="268.6" y="203.2" width="6.1" height="23.1" fill="#486581"/><ellipse cx="271.9" cy="227.4" rx="7.2" ry="3.0" fill="#486581"/><path d="M270.2,229.6 L274.1,229.6 L272.4,236.2 Z" fill="#486581"/><ellipse cx="263.6" cy="227.4" rx="1.7" ry="5.5" fill="#9fb3c8"/><rect x="262" y="187.8" width="19.8" height="16.5" rx="5.0" fill="#243b53"/><rect x="262" y="198.2" width="19.8" height="2.8" fill="#0f766e"/>
<text x="330" y="208" font-size="24" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Motor up to 10 hp</text>
<text x="330" y="236" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">That is 7.5 kW</text>
<rect x="40" y="272" width="640" height="96" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="58" y="290" width="168" height="60" rx="30" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
<text x="142" y="328" font-size="22" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">12 to 15</text>
<rect x="284.5" y="305.0" width="6.8" height="10.5" rx="1.5" fill="#829ab1"/><rect x="271.0" y="308.0" width="8.2" height="31.5" fill="#486581"/><ellipse cx="275.5" cy="341.0" rx="9.8" ry="4.1" fill="#486581"/><path d="M273.2,344.0 L278.5,344.0 L276.2,353.0 Z" fill="#486581"/><ellipse cx="264.2" cy="341.0" rx="2.2" ry="7.5" fill="#9fb3c8"/><rect x="262" y="287.0" width="27.0" height="22.5" rx="6.8" fill="#243b53"/><rect x="262" y="301.2" width="27.0" height="3.8" fill="#0f766e"/>
<text x="330" y="316" font-size="24" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Motor up to 40 hp</text>
<text x="330" y="344" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">That is 30 kW</text>
<rect x="40" y="380" width="640" height="96" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="58" y="398" width="168" height="60" rx="30" fill="#e6f4f1" stroke="#0f766e" stroke-width="2"/>
<text x="142" y="436" font-size="22" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">16 and older</text>
<rect x="289.0" y="410.0" width="8.1" height="12.6" rx="1.8" fill="#829ab1"/><rect x="272.8" y="413.6" width="9.9" height="37.8" fill="#486581"/><ellipse cx="278.2" cy="453.2" rx="11.7" ry="5.0" fill="#486581"/><path d="M275.5,456.8 L281.8,456.8 L279.1,467.6 Z" fill="#486581"/><ellipse cx="264.7" cy="453.2" rx="2.7" ry="9.0" fill="#9fb3c8"/><rect x="262" y="388.4" width="32.4" height="27.0" rx="8.1" fill="#243b53"/><rect x="262" y="405.5" width="32.4" height="4.5" fill="#0f766e"/>
<text x="330" y="424" font-size="24" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">No age limit on power</text>
<text x="330" y="452" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Still need proof of competency</text>
<rect x="40" y="494" width="640" height="104" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="40" y="494" width="8" height="104" rx="4" fill="#dc2626"/>
<path d="M80,566 L176,566 Q196,562 200,550 L160,550 L146,544 L100,544 L80,552 Z" fill="#f0b429" stroke="#8d6708" stroke-width="1.5"/>
<rect x="102" y="536" width="44" height="10" rx="5" fill="#334e68"/>
<path d="M162,550 L168,526 L180,524" fill="none" stroke="#334e68" stroke-width="4" stroke-linecap="round"/>
<path d="M74,572 q10,-4 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#0e7490" stroke-width="1.5"/>
<circle cx="140" cy="548" r="44" fill="none" stroke="#dc2626" stroke-width="7"/>
<line x1="109" y1="517" x2="171" y2="579" stroke="#dc2626" stroke-width="7"/>
<text x="230" y="538" font-size="22" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Under 16: no personal watercraft</text>
<text x="230" y="568" font-size="18" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Not even with someone supervising.</text>
<rect x="40" y="614" width="640" height="132" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="40" y="614" width="8" height="132" rx="4" fill="#0f766e"/>
<circle cx="116" cy="658" r="9.2" fill="#f2c4a0" stroke="#7c5a3a" stroke-width="1.2"/><path d="M101.0,692.5 Q101.0,669.5 116,669.5 Q130.9,669.5 130.9,692.5 Z" fill="#0f766e"/>
<circle cx="166" cy="670" r="6.8" fill="#f2c4a0" stroke="#7c5a3a" stroke-width="1.2"/><path d="M154.9,695.5 Q154.9,678.5 166,678.5 Q177.1,678.5 177.1,695.5 Z" fill="#f0b429"/>
<path d="M70,694 L210,694 L198,718 L84,718 Z" fill="#d9e2ec" stroke="#486581" stroke-width="2"/>
<path d="M64,722 q10,-4 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none" stroke="#0e7490" stroke-width="1.5"/>
<text x="230" y="652" font-size="21" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Direct supervision means:</text>
<text x="230" y="680" font-size="18" text-anchor="start" fill="#102a43" font-family="Liberation Sans">a person 16 or older is in the boat</text>
<text x="230" y="704" font-size="18" text-anchor="start" fill="#102a43" font-family="Liberation Sans">and is watching the young driver.</text>
<text x="230" y="730" font-size="18" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Then the hp limits do not apply.</text>
<text x="360" y="772" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
