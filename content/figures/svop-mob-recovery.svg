<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 796" width="720" height="796" role="img">
<title>Man overboard</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
</marker>
<marker id="ahn" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a5f"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
</defs>
<rect width="720" height="796" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="796" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Man overboard</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Keep eyes on the person, get flotation to them, come back slowly.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="40.0" y="130.0" font-size="19" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Right away</text>
<rect x="40" y="142" width="200" height="128" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="62" cy="164" r="14" fill="#0f766e"/>
<text x="62.0" y="170.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">1</text>
<path d="M114,160 h68 a8,8 0 0 1 8,8 v24 a8,8 0 0 1 -8,8 h-40 l-14,12 l2,-12 h-16 a8,8 0 0 1 -8,-8 v-24 a8,8 0 0 1 8,-8 z" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="152.0" y="188.0" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">MOB!</text>
<text x="140.0" y="234.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Shout "Man</text>
<text x="140.0" y="255.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">overboard!"</text>
<rect x="260" y="142" width="200" height="128" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="282" cy="164" r="14" fill="#0f766e"/>
<text x="282.0" y="170.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">2</text>
<path d="M338,182 Q362,160 386,182 Q362,204 338,182 Z" fill="#ffffff" stroke="#1e3a5f" stroke-width="2.2"/><circle cx="362" cy="182" r="8" fill="#1e3a5f"/><circle cx="365" cy="179" r="2.4" fill="#ffffff"/><line x1="390" y1="182" x2="410" y2="182" stroke="#0f766e" stroke-width="4" marker-end="url(#ah)"/>
<text x="360.0" y="234.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Point and keep</text>
<text x="360.0" y="255.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">watching</text>
<rect x="480" y="142" width="200" height="128" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="502" cy="164" r="14" fill="#0f766e"/>
<text x="502.0" y="170.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">3</text>
<circle cx="588" cy="182" r="18" fill="none" stroke="#1e3a5f" stroke-width="9.959999999999999"/><circle cx="588" cy="182" r="18" fill="none" stroke="#ffffff" stroke-width="7.56"/><circle cx="588" cy="182" r="18" fill="none" stroke="#dc2626" stroke-width="7.56" stroke-dasharray="14.14 14.14" transform="rotate(-22 588 182)"/>
<text x="580.0" y="234.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Throw a lifebuoy at</text>
<text x="580.0" y="255.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">once</text>
<rect x="40" y="282" width="200" height="128" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="62" cy="304" r="14" fill="#0f766e"/>
<text x="62.0" y="310.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">4</text>
<rect x="114" y="298" width="68" height="48" rx="8" fill="#1e3a5f"/><rect x="120" y="304" width="34" height="36" rx="3" fill="#bae6fd"/><path d="M124,332 L136,320 L146,328" fill="none" stroke="#1e3a5f" stroke-width="1.6"/><circle cx="136" cy="320" r="3" fill="#dc2626"/><rect x="157" y="312" width="21" height="20" rx="4" fill="#dc2626"/><circle cx="167.5" cy="322" r="4" fill="#ffffff"/>
<text x="140.0" y="374.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Mark the position</text>
<text x="140.0" y="395.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">(GPS MOB button)</text>
<rect x="260" y="282" width="200" height="128" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="282" cy="304" r="14" fill="#0f766e"/>
<text x="282.0" y="310.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">5</text>
<path d="M350,344 L350,318 A18,18 0 0 1 386,318 L386,334" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#ah)"/>
<text x="360.0" y="374.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Slow down and turn</text>
<text x="360.0" y="395.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">back</text>
<rect x="480" y="282" width="200" height="128" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="502" cy="304" r="14" fill="#0f766e"/>
<text x="502.0" y="310.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">6</text>
<line x1="596" y1="292" x2="596" y2="306" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round"/><rect x="574" y="304" width="28" height="44" rx="6" fill="#1e3a5f"/><rect x="579" y="310" width="18" height="12" rx="2" fill="#bae6fd"/><circle cx="588" cy="334" r="5" fill="#64748b"/><path d="M610,308 q8,8 0,16 M616,302 q14,14 0,28" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round"/>
<text x="580.0" y="374.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Mayday or Pan-Pan on</text>
<text x="580.0" y="395.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">the radio</text>
<text x="40.0" y="444.0" font-size="19" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Approach and recovery</text>
<rect x="40" y="456" width="250" height="256" rx="12" fill="url(#sea)"/>
<text x="56.0" y="484.0" font-size="17" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Wheel toward the side</text>
<text x="56.0" y="505.0" font-size="17" text-anchor="start" fill="#102a43" font-family="Liberation Sans">they fell from</text>
<g transform="rotate(16 160 612.0)"><path d="M160,560 C182.0,586.0 182.0,606.8 182.0,658 Q182.0,664 176.0,664 L144.0,664 Q138.0,664 138.0,658 C138.0,606.8 138.0,586.0 160,560 Z" fill="#ffffff" stroke="#1e3a5f" stroke-width="2.4"/><rect x="149.0" y="606.8" width="22.0" height="22.88" rx="4" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><rect x="156" y="664" width="8" height="10" rx="2" fill="#64748b" stroke="#1e3a5f" stroke-width="1.2"/></g>
<circle cx="222" cy="654" r="15" fill="#a5dcef" opacity="0.9"/><circle cx="222" cy="654" r="11" fill="#f97316" stroke="#9a3412" stroke-width="1.6"/><circle cx="222" cy="654" r="6.5" fill="#f2c9a0" stroke="#7c4a1e" stroke-width="1.2"/>
<text x="200.0" y="702.0" font-size="15" text-anchor="middle" fill="#1e3a5f" font-weight="bold" font-family="Liberation Sans">Fell off starboard</text>
<path d="M128,674 Q104,680 80,664" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#ah)"/>
<text x="56.0" y="532.0" font-size="16" text-anchor="start" fill="#0f766e" font-family="Liberation Sans">Stern and prop</text>
<text x="56.0" y="553.0" font-size="16" text-anchor="start" fill="#0f766e" font-family="Liberation Sans">swing away</text>
<rect x="306" y="456" width="374" height="256" rx="12" fill="url(#sea)"/>
<line x1="552" y1="470" x2="552" y2="506" stroke="#1e3a5f" stroke-width="3.5" marker-end="url(#ahn)"/>
<line x1="652" y1="470" x2="652" y2="506" stroke="#1e3a5f" stroke-width="3.5" marker-end="url(#ahn)"/>
<text x="602.0" y="494.0" font-size="17" text-anchor="middle" fill="#1e3a5f" font-weight="bold" font-family="Liberation Sans">Wind</text>
<circle cx="642" cy="528" r="9" fill="none" stroke="#1e3a5f" stroke-width="6.18"/><circle cx="642" cy="528" r="9" fill="none" stroke="#ffffff" stroke-width="3.78"/><circle cx="642" cy="528" r="9" fill="none" stroke="#dc2626" stroke-width="3.78" stroke-dasharray="7.07 7.07" transform="rotate(-22 642 528)"/>
<circle cx="612" cy="538" r="15" fill="#a5dcef" opacity="0.9"/><circle cx="612" cy="538" r="11" fill="#f97316" stroke="#9a3412" stroke-width="1.6"/><circle cx="612" cy="538" r="6.5" fill="#f2c9a0" stroke="#7c4a1e" stroke-width="1.2"/>
<path d="M646,698 C642,668 588,692 588,688" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M588,568 C608.0,593.0 608.0,613.0 608.0,662 Q608.0,668 602.0,668 L574.0,668 Q568.0,668 568.0,662 C568.0,613.0 568.0,593.0 588,568 Z" fill="#ffffff" stroke="#1e3a5f" stroke-width="2.4"/><rect x="578.0" y="613.0" width="20.0" height="22.0" rx="4" fill="#dbeafe" stroke="#1e3a5f" stroke-width="1.6"/><rect x="584" y="668" width="8" height="10" rx="2" fill="#64748b" stroke="#1e3a5f" stroke-width="1.2"/>
<line x1="588" y1="562" x2="594" y2="560" stroke="#0f766e" stroke-width="3" marker-end="url(#ah)"/>
<line x1="544" y1="598" x2="544" y2="648" stroke="#52606d" stroke-width="2.6" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
<text x="536.0" y="628.0" font-size="15" text-anchor="end" fill="#52606d" font-weight="bold" font-family="Liberation Sans">Drift</text>
<text x="322.0" y="486.0" font-size="17" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Come in slowly,</text>
<text x="322.0" y="507.0" font-size="17" text-anchor="start" fill="#102a43" font-family="Liberation Sans">into the wind</text>
<text x="322.0" y="552.0" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Person on the</text>
<text x="322.0" y="573.0" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">windward side:</text>
<text x="322.0" y="594.0" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">boat drifts away,</text>
<text x="322.0" y="615.0" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">not over them</text>
<text x="322.0" y="662.0" font-size="16" text-anchor="start" fill="#dc2626" font-family="Liberation Sans">Neutral when close:</text>
<text x="322.0" y="683.0" font-size="16" text-anchor="start" fill="#dc2626" font-family="Liberation Sans">propeller stopped</text>
<line x1="478" y1="670" x2="580" y2="676" stroke="#dc2626" stroke-width="1.6"/>
<circle cx="584" cy="674" r="3" fill="#dc2626"/>
<text x="40.0" y="742.0" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Get a line to them. Bring them aboard at the stern or the lowest point.</text>
<text x="360.0" y="768.0" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
