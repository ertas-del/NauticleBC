<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 732" width="720" height="732" role="img">
<title>One Act, many regulations</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/></filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahn" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102a43"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="720" height="732" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="732" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">One Act, many regulations</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">The Act sets the rules. Each regulation fills in the details.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="200" y="122" width="320" height="76" rx="14" fill="#102a43" filter="url(#s)"/>
<text x="360" y="156" font-size="20" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Canada Shipping Act, 2001</text>
<text x="360" y="182" font-size="15" text-anchor="middle" fill="#d9e2ec" font-family="Liberation Sans">Canada&#x27;s main shipping law</text>
<line x1="360" y1="198" x2="360" y2="222" stroke="#9fb3c8" stroke-width="3"/>
<line x1="40" y1="222" x2="680" y2="222" stroke="#9fb3c8" stroke-width="3"/>
<text x="360" y="250" font-size="17" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Main regulations under it</text>
<rect x="40" y="268" width="200" height="150" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="40" y="268" width="200" height="10" rx="5" fill="#0f766e"/>
<text x="140" y="310" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Small Vessel</text>
<text x="140" y="332" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Regulations</text>
<line x1="70" y1="350" x2="210" y2="350" stroke="#e4e7eb" stroke-width="1"/>
<text x="140" y="376" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Equipment, inspection</text>
<text x="140" y="396" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">and operation</text>
<rect x="260" y="268" width="200" height="150" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="260" y="268" width="200" height="10" rx="5" fill="#2563eb"/>
<text x="360" y="310" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Fishing Vessel Safety</text>
<text x="360" y="332" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Regulations</text>
<line x1="290" y1="350" x2="430" y2="350" stroke="#e4e7eb" stroke-width="1"/>
<text x="360" y="376" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Safety on fishing</text>
<text x="360" y="396" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">vessels</text>
<rect x="480" y="268" width="200" height="150" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="480" y="268" width="200" height="10" rx="5" fill="#7c3aed"/>
<text x="580" y="310" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Marine Personnel</text>
<text x="580" y="332" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Regulations</text>
<line x1="510" y1="350" x2="650" y2="350" stroke="#e4e7eb" stroke-width="1"/>
<text x="580" y="376" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Certificates, crew,</text>
<text x="580" y="396" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">training</text>
<rect x="40" y="434" width="200" height="150" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="40" y="434" width="200" height="10" rx="5" fill="#d97706"/>
<text x="140" y="476" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Collision</text>
<text x="140" y="498" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Regulations</text>
<line x1="70" y1="516" x2="210" y2="516" stroke="#e4e7eb" stroke-width="1"/>
<text x="140" y="542" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Rules of the road</text>
<rect x="260" y="434" width="200" height="150" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="260" y="434" width="200" height="10" rx="5" fill="#16a34a"/>
<text x="360" y="476" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Vessel Pollution and</text>
<text x="360" y="498" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Dangerous Chemicals</text>
<line x1="290" y1="516" x2="430" y2="516" stroke="#e4e7eb" stroke-width="1"/>
<text x="360" y="542" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Oil, garbage, sewage,</text>
<text x="360" y="562" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">reporting</text>
<rect x="480" y="434" width="200" height="150" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="480" y="434" width="200" height="10" rx="5" fill="#dc2626"/>
<text x="580" y="476" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Accident reporting</text>
<text x="580" y="498" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">regulations</text>
<line x1="510" y1="516" x2="650" y2="516" stroke="#e4e7eb" stroke-width="1"/>
<text x="580" y="542" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Shipping casualties and</text>
<text x="580" y="562" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">TSB reporting</text>
<path d="M40,226 L24,226" stroke="#9fb3c8" stroke-width="0"/>
<rect x="40" y="616" width="640" height="70" rx="12" fill="#fffbeb" stroke="#f5d48a" stroke-width="2"/>
<text x="60" y="646" font-size="16" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Which ones apply depends on the vessel&#x27;s size, type and use.</text>
<text x="60" y="670" font-size="15" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">Check the ones for your vessel, and keep up with changes.</text>
<text x="360" y="712" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
