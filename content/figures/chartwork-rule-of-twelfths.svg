<text x="630" y="494" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">16:00</text>
<text x="110" y="494" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">10:00</text>
<polyline points="110.0,442.5 118.7,442.3 127.3,441.9 136.0,441.1 144.7,440.0 153.3,438.6 162.0,436.8 170.7,434.8 179.3,432.5 188.0,429.9 196.7,427.0 205.3,423.9 214.0,420.4 222.7,416.8 231.3,412.8 240.0,408.7 248.7,404.3 257.3,399.7 266.0,394.9 274.7,389.9 283.3,384.8 292.0,379.4 300.7,374.0 309.3,368.4 318.0,362.7 326.7,356.9 335.3,351.0 344.0,345.1 352.7,339.1 361.3,333.0 370.0,327.0 378.7,321.0 387.3,314.9 396.0,308.9 404.7,303.0 413.3,297.1 422.0,291.3 430.7,285.6 439.3,280.0 448.0,274.6 456.7,269.2 465.3,264.1 474.0,259.1 482.7,254.3 491.3,249.7 500.0,245.3 508.7,241.2 517.3,237.2 526.0,233.6 534.7,230.1 543.3,227.0 552.0,224.1 560.7,221.5 569.3,219.2 578.0,217.2 586.7,215.4 595.3,214.0 604.0,212.9 612.7,212.1 621.3,211.7 630.0,211.5" fill="none" stroke="#102a43" stroke-width="3"/>
<text x="118" y="464" font-size="15" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">LW 0.5 m</text>
<text x="624" y="176" font-size="15" text-anchor="end" fill="#102a43" font-weight="bold" font-family="Liberation Sans">HW 4.7 m</text>
<text x="46" y="466" font-size="15" text-anchor="start" fill="#1f2933" font-family="Liberation Sans"></text>
<rect x="40" y="512" width="640" height="166" rx="12" fill="#e6f4f1"/>
<text x="60" y="544" font-size="18" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Example: height of tide at 12:00</text>
<text x="60" y="576" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Range = 4.7 − 0.5 = 4.2 m</text>
<text x="60" y="600" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">2 hours after low water: 1 + 2 = 3 twelfths</text>
<text x="60" y="624" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Rise = 4.2 × 3/12 = 1.05 m</text>
<text x="60" y="648" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Height = 0.5 + 1.05 = 1.55 m</text>
<text x="360" y="700" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
