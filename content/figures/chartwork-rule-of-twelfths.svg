<text x="283" y="494" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">12:00</text>
<rect x="293" y="327" width="67" height="58" rx="4" fill="#5eead4" opacity="0.85"/>
<rect x="293" y="385" width="67" height="58" fill="#d4eef7"/>
<text x="327" y="317" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">+3/12</text>
<text x="370" y="494" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">13:00</text>
<rect x="380" y="269" width="67" height="58" rx="4" fill="#5eead4" opacity="0.85"/>
<rect x="380" y="327" width="67" height="116" fill="#d4eef7"/>
<text x="413" y="259" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">+3/12</text>
<text x="457" y="494" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">14:00</text>
<rect x="467" y="231" width="67" height="38" rx="4" fill="#5eead4" opacity="0.85"/>
<rect x="467" y="269" width="67" height="173" fill="#d4eef7"/>
<text x="500" y="221" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">+2/12</text>
<text x="543" y="494" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">15:00</text>
<rect x="553" y="212" width="67" height="19" rx="4" fill="#5eead4" opacity="0.85"/>
<rect x="553" y="231" width="67" height="212" fill="#d4eef7"/>
