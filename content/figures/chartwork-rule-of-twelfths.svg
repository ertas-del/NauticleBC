<text x="98" y="200" font-size="15" text-anchor="end" fill="#627d98" font-family="Liberation Sans">5 m</text>
<line x1="110" y1="140" x2="630" y2="140" stroke="#eef2f6" stroke-width="1"/>
<text x="98" y="145" font-size="15" text-anchor="end" fill="#627d98" font-family="Liberation Sans">6 m</text>
