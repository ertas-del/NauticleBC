<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" width="720" height="680" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="freshG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#1d4e89"/>
</linearGradient>
<linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
</linearGradient>
<linearGradient id="thin" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#292524"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/>
</linearGradient>
</defs>
<rect width="720" height="680" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="680" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Air receiver</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">The tank stores air. The relief valve is the safety.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="250" y="180" width="220" height="320" rx="110" fill="url(#metal)" stroke="#334155" stroke-width="3" filter="url(#s)"/>
<text x="360.0" y="350.0" font-size="26" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Receiver</text>
<rect x="40" y="180" width="180" height="72" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="40" y="188" width="8" height="56" rx="4" fill="#b91c1c"/>
<text x="134.0" y="216.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Relief valve</text>
<text x="134.0" y="240.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">never blank it off</text>
<line x1="220.0" y1="216.0" x2="267.3" y2="227.0" stroke="#b91c1c" stroke-width="3.2" stroke-linecap="round"/><polygon points="280.0,230.0 268.8,220.7 265.9,233.4" fill="#b91c1c"/>
<rect x="500" y="180" width="180" height="72" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="500" y="188" width="8" height="56" rx="4" fill="#1d4e89"/>
<text x="594.0" y="216.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Pressure gauge</text>
<text x="594.0" y="240.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">cut-in and cut-out</text>
<line x1="500.0" y1="216.0" x2="461.7" y2="234.4" stroke="#1d4e89" stroke-width="3.2" stroke-linecap="round"/><polygon points="450.0,240.0 464.5,240.2 458.9,228.5" fill="#1d4e89"/>
<rect x="40" y="420" width="180" height="72" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="40" y="428" width="8" height="56" rx="4" fill="#0f766e"/>
<text x="134.0" y="456.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">From compressor</text>
<text x="134.0" y="480.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">air in</text>
<line x1="220.0" y1="456.0" x2="259.5" y2="427.6" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round"/><polygon points="270.0,420.0 255.7,422.3 263.2,432.9" fill="#0f766e"/>
<rect x="500" y="340" width="180" height="72" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="500" y="348" width="8" height="56" rx="4" fill="#0f766e"/>
<text x="594.0" y="376.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">To the tools</text>
<text x="594.0" y="400.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">air out</text>
<line x1="500.0" y1="376.0" x2="472.1" y2="364.8" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round"/><polygon points="460.0,360.0 469.7,370.9 474.5,358.8" fill="#0f766e"/>
<rect x="270" y="520" width="180" height="72" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="270" y="528" width="8" height="56" rx="4" fill="#0e7490"/>
<text x="364.0" y="556.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Drain</text>
<text x="364.0" y="580.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">water collects here</text>
<text x="360.0" y="620.0" font-size="16" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">Drain the water. Do not shut the discharge and start it.</text>
<text x="360.0" y="652.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
</svg>