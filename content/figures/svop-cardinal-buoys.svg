<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" width="720" height="870" role="img">
<title>Cardinal buoys</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
</marker>
</defs>
<rect width="720" height="870" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="870" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Cardinal buoys</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Pass on the named side: the safe water is on that side of the mark.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>

<rect x="40" y="114" width="640" height="700" rx="12" fill="url(#sea)" fill-opacity="0.55"/>
<circle cx="360" cy="420" r="62" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 6"/>
<path d="M322,434 L338,402 L356,394 L378,406 L396,432 Z" fill="#78716c" stroke="#44403c" stroke-width="2"/>
<text x="360" y="460" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">Danger</text>
<line x1="80" y1="200" x2="80" y2="150" stroke="#102a43" stroke-width="3"/>
<path d="M80,134 L89,154 L71,154 Z" fill="#102a43"/>
<text x="80" y="226" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">N</text>
<rect x="358" y="134" width="4" height="48" fill="#111827"/>
<path d="M360,124 L373.0,144 L347.0,144 Z" fill="#111827"/>
<path d="M360,150 L373.0,170 L347.0,170 Z" fill="#111827"/>
<rect x="340.0" y="182.0" width="40" height="45.0" fill="#111827"/>
<rect x="340.0" y="227.0" width="40" height="45.0" fill="#facc15"/>
<rect x="340.0" y="182" width="40" height="90" fill="none" stroke="#111827" stroke-width="2"/>
<path d="M324,272 q9,-5 18,0 t18,0 t18,0 t18,0" fill="none" stroke="#0e7490" stroke-width="2"/>
<text x="410" y="150" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">North cardinal</text>
<text x="410" y="176" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Black over yellow, cones up</text>
<text x="410" y="200" font-size="16" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Pass to the north</text>
<text x="410" y="230" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Q white:</text>
<circle cx="490" cy="225" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="503" cy="225" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="516" cy="225" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="529" cy="225" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="542" cy="225" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="555" cy="225" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="568" cy="225" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="581" cy="225" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<text x="594" y="230" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">...</text>
<text x="410" y="252" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">continuous quick flashes</text>
<rect x="358" y="620" width="4" height="48" fill="#111827"/>
<path d="M347.0,610 L373.0,610 L360,630 Z" fill="#111827"/>
<path d="M347.0,636 L373.0,636 L360,656 Z" fill="#111827"/>
<rect x="340.0" y="668.0" width="40" height="45.0" fill="#facc15"/>
<rect x="340.0" y="713.0" width="40" height="45.0" fill="#111827"/>
<rect x="340.0" y="668" width="40" height="90" fill="none" stroke="#111827" stroke-width="2"/>
<path d="M324,758 q9,-5 18,0 t18,0 t18,0 t18,0" fill="none" stroke="#0e7490" stroke-width="2"/>
<text x="410" y="646" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">South cardinal</text>
<text x="410" y="672" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Yellow over black, cones down</text>
<text x="410" y="696" font-size="16" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Pass to the south</text>
<text x="410" y="726" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Q(6) + LFl:</text>
<circle cx="508" cy="721" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="521" cy="721" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="534" cy="721" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="547" cy="721" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="560" cy="721" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="573" cy="721" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<rect x="588" y="716" width="38" height="10" rx="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<text x="410" y="748" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">6 quick, then 1 long flash</text>
