<rect x="105.0" y="388.0" width="40" height="30.0" fill="#111827"/>
<rect x="105.0" y="418.0" width="40" height="30.0" fill="#facc15"/>
<rect x="105.0" y="358" width="40" height="90" fill="none" stroke="#111827" stroke-width="2"/>
<path d="M89,448 q9,-5 18,0 t18,0 t18,0 t18,0" fill="none" stroke="#0e7490" stroke-width="2"/>
<text x="125" y="478" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">West cardinal</text>
<text x="125" y="502" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Yellow-black-yellow</text>
<text x="125" y="524" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Cones point to point</text>
<text x="125" y="548" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Pass to the west</text>
<text x="60" y="576" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Q(9):</text>
<circle cx="112" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="125" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="138" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="151" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="164" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="177" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="190" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="203" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="216" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<rect x="593" y="310" width="4" height="48" fill="#111827"/>
<path d="M595,300 L608.0,320 L582.0,320 Z" fill="#111827"/>
<path d="M582.0,326 L608.0,326 L595,346 Z" fill="#111827"/>
<rect x="575.0" y="358.0" width="40" height="30.0" fill="#111827"/>
<rect x="575.0" y="388.0" width="40" height="30.0" fill="#facc15"/>
<rect x="575.0" y="418.0" width="40" height="30.0" fill="#111827"/>
<rect x="575.0" y="358" width="40" height="90" fill="none" stroke="#111827" stroke-width="2"/>
<path d="M559,448 q9,-5 18,0 t18,0 t18,0 t18,0" fill="none" stroke="#0e7490" stroke-width="2"/>
<text x="595" y="478" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">East cardinal</text>
<text x="595" y="502" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Black-yellow-black</text>
<text x="595" y="524" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Cones base to base</text>
<text x="595" y="548" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Pass to the east</text>
<text x="565" y="576" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Q(3):</text>
<circle cx="617" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="630" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<circle cx="643" cy="571" r="5" fill="#ffffff" stroke="#102a43" stroke-width="1.5"/>
<text x="360" y="795" font-size="15" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">All lights white. Q = quick flashing, about one flash a second.</text>
<text x="360" y="842" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
