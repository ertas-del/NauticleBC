<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" role="img">
<title>Who the SVOP covers</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
</marker>
<marker id="ahd" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
</marker>
</defs>
<rect width="720" height="780" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="780" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Who the SVOP covers</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">The person in charge of these small vessels, on these voyages.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>

<rect x="40" y="116" width="310" height="286" rx="12" fill="#ffffff" filter="url(#s)"/>
<text x="195" y="150" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Small commercial vessel</text>
<rect x="64" y="238" width="262" height="18" rx="4" fill="#a9d8ea"/>
<rect x="150" y="176" width="92" height="34" rx="6" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<rect x="160" y="184" width="19" height="13" rx="2" fill="#7dd3fc" stroke="#111827" stroke-width="1.2"/>
<rect x="187" y="184" width="19" height="13" rx="2" fill="#7dd3fc" stroke="#111827" stroke-width="1.2"/>
<rect x="214" y="184" width="19" height="13" rx="2" fill="#7dd3fc" stroke="#111827" stroke-width="1.2"/>
<path d="M92,210 L302,204 Q288,236 256,240 L106,240 Q94,232 92,210 Z" fill="#f59e0b" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><line x1="96" y1="218" x2="294" y2="213" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
<text x="195" y="300" font-size="30" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Up to 5 GT</text>
<text x="195" y="324" font-size="16" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">gross tonnage</text>
<rect x="84" y="348" width="34" height="18" rx="3" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
<rect x="96" y="338" width="9" height="12" fill="#1f2937"/>
<path d="M66,366 L140,364 Q136,380 124,382 L74,382 Q66,376 66,366 Z" fill="#334155" stroke="#111827" stroke-width="1.5"/>
<circle cx="103" cy="362" r="30" fill="none" stroke="#dc2626" stroke-width="5"/><line x1="82.0" y1="341.0" x2="124.0" y2="383.0" stroke="#dc2626" stroke-width="5"/>
<text x="156" y="358" font-size="20" text-anchor="start" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">Not tugs</text>
<text x="156" y="382" font-size="16" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Tugs are excluded</text>
<rect x="370" y="116" width="310" height="286" rx="12" fill="#ffffff" filter="url(#s)"/>
<text x="525" y="150" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Fishing vessel</text>
<rect x="394" y="220" width="262" height="18" rx="4" fill="#a9d8ea"/>
<line x1="470" y1="186" x2="470" y2="164" stroke="#111827" stroke-width="3"/>
<line x1="470" y1="168" x2="428" y2="188" stroke="#111827" stroke-width="2.5"/>
<rect x="520" y="160" width="62" height="32" rx="5" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<rect x="556" y="168" width="20" height="12" rx="2" fill="#7dd3fc" stroke="#111827" stroke-width="1.2"/>
<rect x="530" y="168" width="20" height="12" rx="2" fill="#7dd3fc" stroke="#111827" stroke-width="1.2"/>
<path d="M412,192 L638,186 Q624,218 592,222 L426,222 Q414,214 412,192 Z" fill="#1d4ed8" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><line x1="416" y1="200" x2="630" y2="195" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
<line x1="414" y1="252" x2="634" y2="252" stroke="#0f766e" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="412" y1="242" x2="412" y2="262" stroke="#0f766e" stroke-width="2"/>
<line x1="638" y1="236" x2="638" y2="262" stroke="#0f766e" stroke-width="2"/>
<text x="525" y="300" font-size="30" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Up to 15 GT</text>
<text x="525" y="326" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">or</text>
<text x="525" y="362" font-size="26" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">not more than 12 m</text>
<text x="525" y="386" font-size="16" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">long</text>
<rect x="40" y="420" width="640" height="166" rx="12" fill="#ffffff" filter="url(#s)"/>
<text x="60" y="452" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">On these voyages</text>
<rect x="60" y="466" width="384" height="104" rx="8" fill="#5fa8d3"/>
<path d="M68,466 L260,466 C256,506 274,536 260,570 L68,570 Q60,570 60,562 L60,474 Q60,466 68,466 Z" fill="#d4eef7"/>
<path d="M68,466 L112,466 C130,496 104,530 120,570 L68,570 Q60,570 60,562 L60,474 Q60,466 68,466 Z" fill="#e9dcc0" stroke="#b8a37a" stroke-width="2"/>
<ellipse cx="256" cy="488" rx="20" ry="11" fill="#e9dcc0" stroke="#b8a37a" stroke-width="2"/>
<ellipse cx="266" cy="552" rx="16" ry="9" fill="#e9dcc0" stroke="#b8a37a" stroke-width="2"/>
<text x="192" y="514" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Sheltered</text>
<text x="192" y="536" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">waters</text>
<text x="360" y="514" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Near coastal</text>
<text x="360" y="536" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Class 2</text>
<path d="M322,558 q6,-5 12,0 t12,0" fill="none" stroke="#ffffff" stroke-width="2"/>
<path d="M380,488 q6,-5 12,0 t12,0" fill="none" stroke="#ffffff" stroke-width="2"/>
<path d="M404,556 q6,-5 12,0 t12,0" fill="none" stroke="#ffffff" stroke-width="2"/>
<circle cx="482" cy="500" r="13" fill="#fde68a"/><circle cx="488" cy="495" r="11" fill="#ffffff"/>
<text x="506" y="506" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Day or night</text>
<text x="506" y="538" font-size="17" text-anchor="start" fill="#102a43" font-family="Liberation Sans">and in restricted</text>
<text x="506" y="562" font-size="17" text-anchor="start" fill="#102a43" font-family="Liberation Sans">visibility</text>
<rect x="40" y="604" width="640" height="100" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="94" cy="636" r="13" fill="#f2c9a0" stroke="#111827" stroke-width="1.5"/>
<path d="M74,690 L76,664 Q78,652 94,652 Q110,652 112,664 L114,690 Z" fill="#0f766e" stroke="#111827" stroke-width="1.5"/>
<rect x="112" y="610" width="46" height="28" rx="14" fill="#dc2626"/>
<text x="135" y="630" font-size="18" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">18+</text>
<text x="170" y="640" font-size="20" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Operator must be at least 18</text>
<text x="170" y="668" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">The person in charge needs the SVOP. Other crew</text>
<text x="170" y="690" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">may need other training, e.g. ROC-M or first aid.</text>
<text x="360" y="732" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Check current limits with Transport Canada.</text>
<text x="360" y="752" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
