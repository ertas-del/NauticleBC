<text x="281.0" y="152" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">6 m</text>
<text x="395.0" y="134" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Over 6 m</text>
<text x="395.0" y="152" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">to 9 m</text>
