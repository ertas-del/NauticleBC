<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="freshG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#1d4e89"/>
</linearGradient>
<linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
</linearGradient>
<linearGradient id="thin" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#292524"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/>
</linearGradient>
</defs>
<rect width="720" height="560" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="560" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">What the oil is telling you</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Look at it before you top it up.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="80" y="160" width="160" height="300" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="135" y="210" width="50" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<rect x="139" y="250" width="42" height="106" fill="url(#amber)"/>
<rect x="148" y="198" width="24" height="16" fill="#94a3b8"/>
<text x="160.0" y="400.0" font-size="20" text-anchor="middle" fill="#276749" font-weight="bold" font-family="Liberation Sans">Clean</text>
<text x="160.0" y="428.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">The oil you want.</text>
<rect x="280" y="160" width="160" height="300" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="335" y="210" width="50" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<rect x="339" y="250" width="42" height="106" fill="url(#milk)"/>
<rect x="348" y="198" width="24" height="16" fill="#94a3b8"/>
<text x="360.0" y="400.0" font-size="20" text-anchor="middle" fill="#1d4e89" font-weight="bold" font-family="Liberation Sans">Milky</text>
<text x="360.0" y="428.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Water or coolant.</text>
<rect x="480" y="160" width="160" height="300" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="535" y="210" width="50" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<rect x="539" y="250" width="42" height="106" fill="url(#thin)"/>
<rect x="548" y="198" width="24" height="16" fill="#94a3b8"/>
<text x="560.0" y="400.0" font-size="20" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">Thin and dark</text>
<text x="560.0" y="428.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Fuel has diluted it.</text>
<text x="360.0" y="500.0" font-size="18" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">Low oil pressure: stop the engine, then look.</text>
<text x="360.0" y="532.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
</svg>