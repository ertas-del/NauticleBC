<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="t d">
<title id="t">Head-on situation, Rule 14</title>
<desc id="d">Two power-driven vessels meet on opposite courses. Each turns to starboard so they pass port side to port side.</desc>
<rect width="600" height="520" fill="#ffffff"/>
<rect x="10" y="10" width="580" height="500" rx="12" fill="#e8f3fb"/><text x="300" y="55" font-size="29" text-anchor="middle" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">Head-on: both turn to starboard</text><path d="M240 120 V215 Q240 250 205 295 L190 350" fill="none" stroke="#2f6fa8" stroke-width="5" stroke-dasharray="10 8"/><path d="M360 400 V305 Q360 270 395 225 L410 170" fill="none" stroke="#e08a1e" stroke-width="5" stroke-dasharray="10 8"/><g transform="translate(240,120) rotate(180)"><polygon points="0,-34 14,-6 14,30 -14,30 -14,-6" fill="#2f6fa8" stroke="#16324f" stroke-width="3"/><circle cx="0" cy="4" r="4" fill="#fff"/></g><g transform="translate(360,400) rotate(0)"><polygon points="0,-34 14,-6 14,30 -14,30 -14,-6" fill="#e08a1e" stroke="#16324f" stroke-width="3"/><circle cx="0" cy="4" r="4" fill="#fff"/></g><rect x="60.0" y="73" width="140" height="34" rx="8" fill="#2f6fa8"/><text x="130" y="97" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold" font-family="Inter, Arial, sans-serif">Vessel A</text><rect x="400.0" y="423" width="140" height="34" rx="8" fill="#e08a1e"/><text x="470" y="447" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold" font-family="Inter, Arial, sans-serif">Vessel B</text><text x="272" y="328" font-size="22" text-anchor="middle" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">Pass</text><text x="272" y="354" font-size="22" text-anchor="middle" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">port to port</text><text x="300" y="490" font-size="24" text-anchor="middle" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">No stand-on vessel: both give way.</text>
</svg>
