<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" width="720" height="740" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
</marker>
</defs>
<rect width="720" height="740" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="740" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Stability: G, B, M and GZ</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Heeled boat: weight and buoyancy make a couple that rights her.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="40" y="445" width="400" height="160" fill="url(#seaG)" opacity="0.85"/>
<line x1="40.0" y1="445.0" x2="440.0" y2="445.0" stroke="#0e7490" stroke-width="2.5" stroke-linecap="butt"/>
<path d="M118.8,331.9 L379.6,401.8 L350.9,482.1 Q319.3,530.6 207.8,521.4 Q106.7,473.6 103.6,415.8 Z" fill="#ffffff" fill-opacity="0.75" stroke="#102a43" stroke-width="3" stroke-linejoin="round"/>
<polygon points="191.3,351.3 204.2,303.0 305.6,330.2 307.2,382.4" fill="#e2e8f0" stroke="#102a43" stroke-width="2.5"/>
<line x1="206.0" y1="528.2" x2="299.7" y2="178.5" stroke="#627d98" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="291.9" y1="478.0" x2="291.9" y2="189.5" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="235.0" y1="426.0" x2="235.0" y2="528.0" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="235.0" y="556.0" font-size="18" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">Weight</text>
<line x1="291.9" y1="590.0" x2="291.9" y2="486.0" stroke="#0e7490" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="303.9" y="582.0" font-size="18" text-anchor="start" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Buoyancy</text>
<line x1="235.0" y1="420.0" x2="291.9" y2="420.0" stroke="#7c2d12" stroke-width="5" stroke-linecap="butt"/>
<circle cx="235.0" cy="420.0" r="6" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>
<circle cx="291.9" cy="478.0" r="6" fill="#0e7490" stroke="#ffffff" stroke-width="2"/>
<circle cx="291.9" cy="207.5" r="6" fill="#102a43" stroke="#ffffff" stroke-width="2"/>
<circle cx="291.9" cy="420.0" r="6" fill="#7c2d12" stroke="#ffffff" stroke-width="2"/>
<text x="221.0" y="427.0" font-size="20" text-anchor="end" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">G</text>
<text x="303.9" y="484.0" font-size="20" text-anchor="start" fill="#0e7490" font-weight="bold" font-family="Liberation Sans">B</text>
<text x="305.9" y="213.5" font-size="20" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">M</text>
<text x="303.9" y="427.0" font-size="20" text-anchor="start" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">Z</text>
<text x="267.5" y="408.0" font-size="16" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">GZ</text>
<path d="M291.9,267.5 A60,60 0 0 1 276.4,265.5" fill="none" stroke="#102a43" stroke-width="1.8"/>
<text x="263.9" y="275.5" font-size="16" text-anchor="end" fill="#102a43" font-weight="bold" font-family="Liberation Sans">15°</text>
<text x="40.0" y="142.0" font-size="17" text-anchor="start" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">G</text>
<text x="74.0" y="142.0" font-size="16" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">centre of gravity</text>
<text x="40.0" y="166.0" font-size="17" text-anchor="start" fill="#0e7490" font-weight="bold" font-family="Liberation Sans">B</text>
<text x="74.0" y="166.0" font-size="16" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">centre of buoyancy</text>
<text x="40.0" y="190.0" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">M</text>
<text x="74.0" y="190.0" font-size="16" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">metacentre</text>
<text x="40.0" y="214.0" font-size="17" text-anchor="start" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">GZ</text>
<text x="74.0" y="214.0" font-size="16" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">righting arm</text>
<rect x="466" y="118" width="214" height="487" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<text x="482.0" y="146.0" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Raise the weight</text>
<circle cx="616" cy="210" r="6" fill="#102a43"/>
<text x="628.0" y="216.0" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">M</text>
<line x1="616.0" y1="210.0" x2="616.0" y2="490.0" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="616.0" y1="210.0" x2="542.2" y2="485.3" stroke="#627d98" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="8 6"/>
<line x1="553.9" y1="441.8" x2="616.0" y2="441.8" stroke="#7c2d12" stroke-width="5" stroke-linecap="butt"/>
<circle cx="553.9" cy="441.8" r="6" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>
<text x="539.9" y="447.8" font-size="17" text-anchor="end" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">G low</text>
<text x="584.9" y="467.8" font-size="16" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">GZ</text>
<line x1="587.5" y1="316.3" x2="616.0" y2="316.3" stroke="#7c2d12" stroke-width="5" stroke-linecap="butt"/>
<circle cx="587.5" cy="316.3" r="6" fill="#d97706" stroke="#ffffff" stroke-width="2"/>
<text x="573.5" y="322.3" font-size="17" text-anchor="end" fill="#d97706" font-weight="bold" font-family="Liberation Sans">G high</text>
<text x="601.8" y="342.3" font-size="16" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">GZ</text>
<text x="482.0" y="522.0" font-size="16" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">G moves up toward M:</text>
<text x="482.0" y="544.0" font-size="16" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">GZ gets shorter.</text>
<text x="482.0" y="570.0" font-size="16" text-anchor="start" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">High weight,</text>
<text x="482.0" y="590.0" font-size="16" text-anchor="start" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">less stability.</text>
<text x="40.0" y="640.0" font-size="17" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">B moves to the low side as she heels. G stays put. GZ is the level</text>
<text x="40.0" y="664.0" font-size="17" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">distance from G to the upward line of buoyancy through B.</text>
<text x="40.0" y="690.0" font-size="16" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Not to scale.</text>
<text x="360.0" y="718.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
