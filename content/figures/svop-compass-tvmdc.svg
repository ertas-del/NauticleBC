<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
</marker>
</defs>
<rect width="720" height="800" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="800" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Compass error ladder: TVMDC</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">True, Variation, Magnetic, Deviation, Compass. Apply each error in turn.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<line x1="140.0" y1="150.0" x2="140.0" y2="520.0" stroke="#9fb3c8" stroke-width="6" stroke-linecap="round"/>
<line x1="300.0" y1="150.0" x2="300.0" y2="520.0" stroke="#9fb3c8" stroke-width="6" stroke-linecap="round"/>
<rect x="120" y="149" width="200" height="52" rx="10" fill="#102a43"/>
<text x="220.0" y="183.0" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">TRUE</text>
<rect x="134" y="234" width="172" height="42" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<text x="220.0" y="262.0" font-size="18" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">Variation error</text>
<rect x="120" y="309" width="200" height="52" rx="10" fill="#102a43"/>
<text x="220.0" y="343.0" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">MAGNETIC</text>
<rect x="134" y="394" width="172" height="42" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
<text x="220.0" y="422.0" font-size="18" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">Deviation error</text>
<rect x="120" y="469" width="200" height="52" rx="10" fill="#102a43"/>
<text x="220.0" y="503.0" font-size="22" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">COMPASS</text>
<line x1="86.0" y1="160.0" x2="86.0" y2="505.0" stroke="#c05621" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="66.0" y="335.0" font-size="17" text-anchor="middle" fill="#c05621" font-weight="bold" font-family="Liberation Sans" transform="rotate(-90 66.0 335.0)">True to Compass</text>
<line x1="354.0" y1="505.0" x2="354.0" y2="160.0" stroke="#0e7490" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="380.0" y="335.0" font-size="17" text-anchor="middle" fill="#0e7490" font-weight="bold" font-family="Liberation Sans" transform="rotate(90 380.0 335.0)">Compass to True</text>
<rect x="410" y="118" width="270" height="440" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<text x="430.0" y="146.0" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Worked example</text>
<text x="434.0" y="185.0" font-size="26" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">034°</text>
<text x="434.0" y="263.0" font-size="19" text-anchor="start" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">14° E</text>
<text x="520.0" y="263.0" font-size="19" text-anchor="start" fill="#c05621" font-weight="bold" font-family="Liberation Sans">−14°</text>
<text x="575.0" y="263.0" font-size="16" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">E: subtract</text>
<text x="434.0" y="345.0" font-size="26" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">020°</text>
<text x="434.0" y="423.0" font-size="19" text-anchor="start" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">3° W</text>
<text x="520.0" y="423.0" font-size="19" text-anchor="start" fill="#c05621" font-weight="bold" font-family="Liberation Sans">+3°</text>
<text x="575.0" y="423.0" font-size="16" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">W: add</text>
<text x="434.0" y="505.0" font-size="26" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">023°</text>
<text x="430.0" y="540.0" font-size="15" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Check back up: 023 − 3 + 14 = 034</text>
<rect x="40" y="580" width="312" height="112" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#s)"/>
<text x="58.0" y="610.0" font-size="17" text-anchor="start" fill="#c05621" font-weight="bold" font-family="Liberation Sans">Going down: True to Compass</text>
<text x="58.0" y="640.0" font-size="18" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">West error: add</text>
<text x="58.0" y="670.0" font-size="18" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">East error: subtract</text>
<rect x="368" y="580" width="312" height="112" rx="12" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5" filter="url(#s)"/>
<text x="386.0" y="610.0" font-size="17" text-anchor="start" fill="#0e7490" font-weight="bold" font-family="Liberation Sans">Going up: Compass to True</text>
<text x="386.0" y="640.0" font-size="18" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">East error: add (CADET)</text>
<text x="386.0" y="670.0" font-size="18" text-anchor="start" fill="#102a43" font-weight="normal" font-family="Liberation Sans">West error: subtract</text>
<text x="360.0" y="732.0" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Error east, compass least.  Error west, compass best.</text>
<text x="360.0" y="772.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
