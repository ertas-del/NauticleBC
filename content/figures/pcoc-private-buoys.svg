<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 796" width="720" height="796" role="img">
<title>Private and regulatory buoys</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
</marker>
<marker id="ahd" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
</marker>
<linearGradient id="nightP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d36"/><stop offset="1" stop-color="#12294a"/></linearGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>

<marker id="ahr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
</marker>
</defs>
<rect width="720" height="796" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="796" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Private and regulatory buoys</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">On BC lakes and rivers: white buoys, and the orange symbol is the message.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>

<rect x="40" y="118" width="200" height="280" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="94" y="144" width="92" height="130" rx="12" fill="#ffffff"/><rect x="94" y="154" width="92" height="14" fill="#f97316"/><rect x="94" y="250" width="92" height="14" fill="#f97316"/><rect x="94" y="144" width="92" height="130" rx="12" fill="none" stroke="#111827" stroke-width="1.8"/>
<path d="M140,171 L178,209 L140,247 L102,209 Z" fill="none" stroke="#f97316" stroke-width="6" stroke-linejoin="round"/>
<text x="140" y="215" font-size="15" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Liberation Sans">ROCK</text>
<rect x="65.0" y="264" width="150" height="22" rx="6" fill="#a9d8ea" fill-opacity="0.9"/><path d="M71.0,266 q12,-5 24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#0e7490" stroke-width="1.5"/>
<text x="140" y="324" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Hazard</text><text x="140" y="350" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Danger: rocks, shoal</text><text x="140" y="372" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">or rough water</text>
<rect x="260" y="118" width="200" height="280" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="314" y="144" width="92" height="130" rx="12" fill="#ffffff"/><rect x="314" y="154" width="92" height="14" fill="#f97316"/><rect x="314" y="250" width="92" height="14" fill="#f97316"/><rect x="314" y="144" width="92" height="130" rx="12" fill="none" stroke="#111827" stroke-width="1.8"/>
<path d="M360,171 L398,209 L360,247 L322,209 Z" fill="none" stroke="#f97316" stroke-width="6" stroke-linejoin="round"/>
<path d="M360,185 V233 M336,209 H384" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
<rect x="285.0" y="264" width="150" height="22" rx="6" fill="#a9d8ea" fill-opacity="0.9"/><path d="M291.0,266 q12,-5 24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#0e7490" stroke-width="1.5"/>
<text x="360" y="324" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Keep out</text><text x="360" y="350" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Boats are not</text><text x="360" y="372" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">allowed in</text>
<rect x="480" y="118" width="200" height="280" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="534" y="144" width="92" height="130" rx="12" fill="#ffffff"/><rect x="534" y="154" width="92" height="14" fill="#f97316"/><rect x="534" y="250" width="92" height="14" fill="#f97316"/><rect x="534" y="144" width="92" height="130" rx="12" fill="none" stroke="#111827" stroke-width="1.8"/>
<circle cx="580" cy="209" r="32" fill="none" stroke="#f97316" stroke-width="6"/>
<text x="580" y="218" font-size="26" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Liberation Sans">10</text>
<rect x="505.0" y="264" width="150" height="22" rx="6" fill="#a9d8ea" fill-opacity="0.9"/><path d="M511.0,266 q12,-5 24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#0e7490" stroke-width="1.5"/>
<text x="580" y="324" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Control</text><text x="580" y="350" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Obey the rule inside,</text><text x="580" y="372" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">e.g. 10 km/h limit</text>
<rect x="40" y="416" width="200" height="280" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="94" y="442" width="92" height="130" rx="12" fill="#ffffff"/><rect x="94" y="452" width="92" height="14" fill="#f97316"/><rect x="94" y="548" width="92" height="14" fill="#f97316"/><rect x="94" y="442" width="92" height="130" rx="12" fill="none" stroke="#111827" stroke-width="1.8"/>
<rect x="109" y="476" width="62" height="62" fill="none" stroke="#f97316" stroke-width="6" stroke-linejoin="round"/>
<text x="140" y="505" font-size="16" text-anchor="middle" fill="#111827" font-weight="bold" font-family="Liberation Sans">FUEL</text>
<path d="M126,520 H150 M144,514 L152,520 L144,526" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="65.0" y="562" width="150" height="22" rx="6" fill="#a9d8ea" fill-opacity="0.9"/><path d="M71.0,564 q12,-5 24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#0e7490" stroke-width="1.5"/>
<text x="140" y="622" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Information</text><text x="140" y="648" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Directions or</text><text x="140" y="670" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">services</text>
<rect x="260" y="416" width="200" height="280" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="276" y="474" width="168" height="112" rx="8" fill="#a9d8ea" fill-opacity="0.55"/>
<text x="360" y="500" font-size="15" text-anchor="middle" fill="#0e7490" font-weight="bold" font-family="Liberation Sans">Swim area</text>
<circle cx="356" cy="528" r="9" fill="#f2c9a0" stroke="#111827" stroke-width="1.2"/>
<path d="M366,530 q10,-14 20,-6" fill="none" stroke="#f2c9a0" stroke-width="5" stroke-linecap="round"/>
<path d="M338,537 q9,-4 18,0 t18,0 t18,0" fill="none" stroke="#0e7490" stroke-width="1.5"/>
<line x1="282" y1="560" x2="438" y2="560" stroke="#475569" stroke-width="2.5"/>
<circle cx="304" cy="558" r="15" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
<circle cx="360" cy="558" r="15" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
<circle cx="416" cy="558" r="15" fill="#ffffff" stroke="#111827" stroke-width="1.6"/>
<text x="360" y="622" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Swimming</text><text x="360" y="648" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Edge of a swim area.</text><text x="360" y="670" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Stay outside.</text>
<rect x="480" y="416" width="200" height="280" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="577" y="442" width="5" height="54" fill="#475569"/>
<rect x="582" y="444" width="64" height="42" fill="#dc2626" stroke="#111827" stroke-width="1.4"/>
<polygon points="582,444 595,444 646,476 646,486 633,486 582,454" fill="#ffffff"/>
<rect x="582" y="444" width="64" height="42" fill="none" stroke="#111827" stroke-width="1.4"/>
<rect x="534" y="492" width="92" height="80" rx="12" fill="#ffffff"/><rect x="534" y="492" width="92" height="80" rx="12" fill="none" stroke="#111827" stroke-width="1.8"/>
<rect x="505.0" y="562" width="150" height="22" rx="6" fill="#a9d8ea" fill-opacity="0.9"/><path d="M511.0,564 q12,-5 24,0 t24,0 t24,0 t24,0 t24,0 t24,0" fill="none" stroke="#0e7490" stroke-width="1.5"/>
<text x="580" y="622" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Diving</text><text x="580" y="648" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Divers nearby. Slow</text><text x="580" y="670" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">down, keep well clear</text>
<text x="360" y="726" font-size="16" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">A private buoy is marked PRIV, with the owner's name and contact.</text>
<text x="360" y="768" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
