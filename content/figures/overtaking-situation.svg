<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 610" width="600" height="610" role="img" aria-labelledby="t d">
<title id="t">Overtaking situation, Rule 13</title>
<desc id="d">A vessel coming up from more than 22.5 degrees abaft the beam of another vessel is overtaking and must keep out of her way, whichever side she passes.</desc>
<rect width="600" height="610" fill="#ffffff"/>
<rect x="10" y="10" width="580" height="590" rx="12" fill="#e8f3fb"/><text x="300" y="55" font-size="27" text-anchor="middle" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">Overtaking: the overtaker keeps clear</text><path d="M300 160 L540.2 259.5 A260 260 0 0 1 59.8 259.5 Z" fill="#fff3d6" stroke="#e08a1e" stroke-width="3"/><line x1="70" y1="160" x2="530" y2="160" stroke="#5f6b76" stroke-width="2" stroke-dasharray="6 6"/><text x="532" y="152" font-size="20" text-anchor="end" fill="#5f6b76" font-weight="normal" font-family="Inter, Arial, sans-serif">beam</text><path d="M300 410 V330" fill="none" stroke="#2f6fa8" stroke-width="5" stroke-dasharray="10 8"/><path d="M300 330 Q300 290 240 250 L210 170" fill="none" stroke="#2f6fa8" stroke-width="5"/><g transform="translate(300,160) rotate(0)"><polygon points="0,-34 14,-6 14,30 -14,30 -14,-6" fill="#e08a1e" stroke="#16324f" stroke-width="3"/><circle cx="0" cy="4" r="4" fill="#fff"/></g><g transform="translate(300,430) rotate(0)"><polygon points="0,-34 14,-6 14,30 -14,30 -14,-6" fill="#2f6fa8" stroke="#16324f" stroke-width="3"/><circle cx="0" cy="4" r="4" fill="#fff"/></g><rect x="340.0" y="88" width="180" height="34" rx="8" fill="#e08a1e"/><text x="430" y="112" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold" font-family="Inter, Arial, sans-serif">Vessel ahead</text><rect x="355.0" y="423" width="150" height="34" rx="8" fill="#2f6fa8"/><text x="430" y="447" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold" font-family="Inter, Arial, sans-serif">Overtaker</text><text x="300" y="500" font-size="23" text-anchor="middle" fill="#a05a00" font-weight="bold" font-family="Inter, Arial, sans-serif">Overtaking sector (shaded):</text><text x="300" y="530" font-size="23" text-anchor="middle" fill="#a05a00" font-weight="normal" font-family="Inter, Arial, sans-serif">more than 22.5° abaft her beam.</text><text x="300" y="562" font-size="23" text-anchor="middle" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Overtaker keeps clear, on either side.</text>
</svg>
