<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img">
<title>Spill on the water? Stop, contain, report</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/></filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
<marker id="ahn" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#102a43"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="aho" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>
<rect width="720" height="760" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="760" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Spill on the water? Stop, contain, report</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">You must report any pollution, even a small spill. Do it right away.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="40" y="118" width="310" height="132" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="40" y="118" width="8" height="132" rx="4" fill="#dc2626"/>
<circle cx="78" cy="152" r="16" fill="#dc2626"/>
<text x="78" y="158" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">1</text>
<text x="106" y="159" font-size="20" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Stop the source</text>
<text x="66" y="202" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">If it is safe: shut the nozzle,</text>
<text x="66" y="226" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">close the valve, plug the leak.</text>
<rect x="370" y="118" width="310" height="132" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="370" y="118" width="8" height="132" rx="4" fill="#ea580c"/>
<circle cx="408" cy="152" r="16" fill="#ea580c"/>
<text x="408" y="158" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">2</text>
<text x="436" y="159" font-size="20" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Contain it</text>
<text x="396" y="202" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">Absorbent pads and booms</text>
<text x="396" y="226" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">from your spill kit.</text>
<rect x="40" y="268" width="310" height="132" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="40" y="268" width="8" height="132" rx="4" fill="#0f766e"/>
<circle cx="78" cy="302" r="16" fill="#0f766e"/>
<text x="78" y="308" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">3</text>
<text x="106" y="309" font-size="20" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Report it now</text>
<text x="66" y="352" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">Coast Guard through MCTS:</text>
<text x="66" y="376" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">VHF channel 16 or phone.</text>
<rect x="370" y="268" width="310" height="132" rx="12" fill="#ffffff" filter="url(#s)"/>
<rect x="370" y="268" width="8" height="132" rx="4" fill="#2563eb"/>
<circle cx="408" cy="302" r="16" fill="#2563eb"/>
<text x="408" y="308" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">4</text>
<text x="436" y="309" font-size="20" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Follow instructions</text>
<text x="396" y="352" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">Do what you are told,</text>
<text x="396" y="376" font-size="16" text-anchor="start" fill="#1f2933" font-family="Liberation Sans">and keep records.</text>
<rect x="40" y="428" width="640" height="118" rx="12" fill="#e6f4f1"/>
<text x="60" y="460" font-size="18" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">When you report, say:</text>
<circle cx="66" cy="489" r="5" fill="#0f766e"/>
<text x="80" y="494" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Your position</text>
<circle cx="376" cy="489" r="5" fill="#0f766e"/>
<text x="390" y="494" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">What was spilled</text>
<circle cx="66" cy="521" r="5" fill="#0f766e"/>
<text x="80" y="526" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">About how much</text>
<circle cx="376" cy="521" r="5" fill="#0f766e"/>
<text x="390" y="526" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">What you are doing</text>
<text x="40" y="590" font-size="19" text-anchor="start" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">Never</text>
<rect x="40" y="604" width="310" height="92" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="84" cy="650" r="22" fill="none" stroke="#dc2626" stroke-width="4"/>
<line x1="69" y1="665" x2="99" y2="635" stroke="#dc2626" stroke-width="4"/>
<text x="120" y="642" font-size="16" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Detergent or dispersant</text>
<text x="120" y="666" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">on a spill, unless told to</text>
<rect x="370" y="604" width="310" height="92" rx="12" fill="#ffffff" filter="url(#s)"/>
<circle cx="414" cy="650" r="22" fill="none" stroke="#dc2626" stroke-width="4"/>
<line x1="399" y1="665" x2="429" y2="635" stroke="#dc2626" stroke-width="4"/>
<text x="450" y="642" font-size="16" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Plastic overboard</text>
<text x="450" y="666" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">anywhere, ever</text>
<text x="360" y="738" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
