<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="600" height="540" role="img" aria-labelledby="t d">
<title id="t">Crossing situation, Rule 15</title>
<desc id="d">The give-way vessel has the other vessel on her starboard side. She alters course to starboard and passes astern of the stand-on vessel, which keeps course and speed.</desc>
<rect width="600" height="540" fill="#ffffff"/>
<rect x="10" y="10" width="580" height="520" rx="12" fill="#e8f3fb"/><text x="300" y="55" font-size="29" text-anchor="middle" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">Crossing: give way to the right</text><text x="300" y="98" font-size="22" text-anchor="middle" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">The vessel with the other on her</text><text x="300" y="126" font-size="22" text-anchor="middle" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">starboard side gives way.</text><path d="M250 220 H90" fill="none" stroke="#e08a1e" stroke-width="5" stroke-dasharray="10 8"/><path d="M200 440 V380" fill="none" stroke="#2f6fa8" stroke-width="5" stroke-dasharray="10 8"/><path d="M200 380 Q200 340 260 300 L500 140" fill="none" stroke="#c62828" stroke-width="6"/><line x1="480" y1="153" x2="505" y2="137" stroke="#c62828" stroke-width="6"/><polygon points="505,137 494.8,151.8 487.3,140.0" fill="#c62828"/><g transform="translate(200,440) rotate(0)"><polygon points="0,-34 14,-6 14,30 -14,30 -14,-6" fill="#2f6fa8" stroke="#16324f" stroke-width="3"/><circle cx="0" cy="4" r="4" fill="#fff"/></g><g transform="translate(280,220) rotate(270)"><polygon points="0,-34 14,-6 14,30 -14,30 -14,-6" fill="#e08a1e" stroke="#16324f" stroke-width="3"/><circle cx="0" cy="4" r="4" fill="#fff"/></g><rect x="130.0" y="473" width="140" height="34" rx="8" fill="#2f6fa8"/><text x="200" y="497" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold" font-family="Inter, Arial, sans-serif">Give-way</text><rect x="70.0" y="246" width="140" height="34" rx="8" fill="#e08a1e"/><text x="140" y="270" font-size="22" text-anchor="middle" fill="#fff" font-weight="bold" font-family="Inter, Arial, sans-serif">Stand-on</text><text x="140" y="312" font-size="22" text-anchor="middle" fill="#a05a00" font-weight="bold" font-family="Inter, Arial, sans-serif">Keeps course</text><text x="140" y="340" font-size="22" text-anchor="middle" fill="#a05a00" font-weight="bold" font-family="Inter, Arial, sans-serif">and speed</text><text x="440" y="400" font-size="22" text-anchor="middle" fill="#c62828" font-weight="bold" font-family="Inter, Arial, sans-serif">Turns right</text><text x="440" y="428" font-size="22" text-anchor="middle" fill="#c62828" font-weight="bold" font-family="Inter, Arial, sans-serif">and passes</text><text x="440" y="456" font-size="22" text-anchor="middle" fill="#c62828" font-weight="bold" font-family="Inter, Arial, sans-serif">astern</text>
</svg>
