<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="720" height="840" role="img">
<title>Sound signals</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
</marker>
</defs>
<rect width="720" height="840" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="840" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Sound signals</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Count the blasts: short is about 1 second, prolonged is 4 to 6 seconds.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>

<rect x="40" y="116" width="640" height="54" rx="10" fill="#ffffff" filter="url(#s)"/>
<rect x="62" y="133" width="22" height="20" rx="5" fill="#102a43"/>
<text x="96" y="149" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Short blast, about 1 s</text>
<rect x="330" y="133" width="110" height="20" rx="5" fill="#102a43"/>
<text x="452" y="149" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Prolonged blast, 4 to 6 s</text>
<rect x="40" y="190" width="640" height="34" rx="8" fill="#0f766e"/>
<text x="56" y="213" font-size="18" text-anchor="start" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Vessels in sight of one another (Rule 34)</text>
<rect x="56" y="242" width="22" height="20" rx="5" fill="#102a43"/>
<text x="56" y="286" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">One short</text>
<text x="330" y="258" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Altering course to starboard</text>
<line x1="56" y1="302" x2="664" y2="302" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="56" y="316" width="22" height="20" rx="5" fill="#102a43"/>
<rect x="92" y="316" width="22" height="20" rx="5" fill="#102a43"/>
<text x="56" y="360" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Two short</text>
<text x="330" y="332" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Altering course to port</text>
<line x1="56" y1="376" x2="664" y2="376" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="56" y="390" width="22" height="20" rx="5" fill="#102a43"/>
<rect x="92" y="390" width="22" height="20" rx="5" fill="#102a43"/>
<rect x="128" y="390" width="22" height="20" rx="5" fill="#102a43"/>
<text x="56" y="434" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Three short</text>
<text x="330" y="406" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Operating astern propulsion</text>
<line x1="56" y1="450" x2="664" y2="450" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="56" y="464" width="22" height="20" rx="5" fill="#102a43"/>
<rect x="92" y="464" width="22" height="20" rx="5" fill="#102a43"/>
<rect x="128" y="464" width="22" height="20" rx="5" fill="#102a43"/>
<rect x="164" y="464" width="22" height="20" rx="5" fill="#102a43"/>
<rect x="200" y="464" width="22" height="20" rx="5" fill="#102a43"/>
<text x="56" y="508" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Five or more short, rapid</text>
<text x="330" y="480" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">I doubt your intentions</text>
<text x="330" y="504" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">or that you are doing enough to avoid me</text>
<line x1="56" y1="524" x2="664" y2="524" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="56" y="538" width="110" height="20" rx="5" fill="#102a43"/>
<text x="56" y="582" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">One prolonged</text>
<text x="330" y="554" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Nearing a bend or obscured area</text>
<text x="330" y="578" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Others may be hidden behind it</text>
<rect x="40" y="610" width="640" height="34" rx="8" fill="#0f766e"/>
<text x="56" y="633" font-size="18" text-anchor="start" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Restricted visibility (Rule 35)</text>
<rect x="56" y="662" width="110" height="20" rx="5" fill="#102a43"/>
<text x="56" y="706" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">One prolonged</text>
<text x="330" y="678" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Power-driven, making way</text>
<text x="330" y="702" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">At intervals of not more than 2 minutes</text>
<line x1="56" y1="722" x2="664" y2="722" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="56" y="736" width="110" height="20" rx="5" fill="#102a43"/>
<rect x="180" y="736" width="110" height="20" rx="5" fill="#102a43"/>
<text x="56" y="780" font-size="15" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Two prolonged</text>
<text x="330" y="752" font-size="18" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Power-driven, underway but stopped</text>
<text x="330" y="776" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">At intervals of not more than 2 minutes</text>
<text x="360" y="812" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
