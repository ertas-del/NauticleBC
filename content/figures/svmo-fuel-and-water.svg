<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="freshG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#1d4e89"/>
</linearGradient>
<linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
</linearGradient>
<linearGradient id="thin" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#292524"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/>
</linearGradient>
</defs>
<rect width="720" height="640" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="640" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Fuel tank</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Water is heavier, so it sits at the bottom.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="48" y="140" width="250" height="420" rx="28" fill="#fffbeb" stroke="#f6d7a3" stroke-width="2" filter="url(#s)"/>
<rect x="48" y="430" width="250" height="130" fill="url(#seaG)"/>
<rect x="48" y="250" width="250" height="180" fill="url(#amber)" opacity="0.92"/>
<path d="M48 430 Q173 414 298 430" fill="none" stroke="#0e7490" stroke-width="3"/>
<text x="173.0" y="340.0" font-size="26" text-anchor="middle" fill="#7c2d12" font-weight="bold" font-family="Liberation Sans">Diesel</text>
<text x="173.0" y="500.0" font-size="24" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Liberation Sans">Water</text>
<rect x="78" y="160" width="10" height="360" rx="4" fill="#e2e8f0" stroke="#64748b"/>
<text x="96.0" y="150.0" font-size="14" text-anchor="start" fill="#627d98" font-weight="bold" font-family="Liberation Sans">Sounding</text>
<rect x="360" y="170" width="312" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="360" y="178" width="8" height="68" rx="4" fill="#d97706"/>
<text x="520.0" y="206.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Diesel floats</text>
<text x="520.0" y="230.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Specific gravity about 0.85.</text>
<rect x="360" y="280" width="312" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="360" y="288" width="8" height="68" rx="4" fill="#d97706"/>
<text x="520.0" y="316.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Water sinks</text>
<text x="520.0" y="340.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Drain the tank bottom and the filter bowl.</text>
<rect x="360" y="390" width="312" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="360" y="398" width="8" height="68" rx="4" fill="#d97706"/>
<text x="520.0" y="426.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Bugs live on the line</text>
<text x="520.0" y="450.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">They grow where fuel meets water.</text>
<rect x="360" y="500" width="312" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="360" y="508" width="8" height="68" rx="4" fill="#d97706"/>
<text x="520.0" y="536.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Day tank</text>
<text x="520.0" y="560.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">A small tank that feeds the engine.</text>
<text x="360.0" y="612.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
</svg>