<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="freshG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#1d4e89"/>
</linearGradient>
<linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
</linearGradient>
<linearGradient id="thin" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#292524"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/>
</linearGradient>
</defs>
<rect width="720" height="560" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="560" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Connecting batteries</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Series adds voltage. Parallel adds capacity.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="36" y="130" width="316" height="360" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="368" y="130" width="316" height="360" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<text x="194.0" y="170.0" font-size="24" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Series</text>
<text x="526.0" y="170.0" font-size="24" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Parallel</text>
<rect x="70" y="230" width="90" height="54" rx="6" fill="#fff" stroke="#102a43" stroke-width="2"/><rect x="104" y="222" width="22" height="10" fill="#102a43"/><text x="92.0" y="264.0" font-size="20" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">+</text><text x="138.0" y="264.0" font-size="20" text-anchor="middle" fill="#1d4e89" font-weight="bold" font-family="Liberation Sans">−</text>
<rect x="210" y="230" width="90" height="54" rx="6" fill="#fff" stroke="#102a43" stroke-width="2"/><rect x="244" y="222" width="22" height="10" fill="#102a43"/><text x="232.0" y="264.0" font-size="20" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">+</text><text x="278.0" y="264.0" font-size="20" text-anchor="middle" fill="#1d4e89" font-weight="bold" font-family="Liberation Sans">−</text>
<line x1="162.0" y1="250.0" x2="195.0" y2="250.0" stroke="#102a43" stroke-width="2.5" stroke-linecap="round"/><polygon points="208.0,250.0 195.0,243.5 195.0,256.5" fill="#102a43"/>
<text x="194.0" y="310.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">+ of one to − of the other</text>
<text x="194.0" y="360.0" font-size="18" text-anchor="middle" fill="#243b53" font-weight="normal" font-family="Liberation Sans">12 V + 12 V</text>
<text x="194.0" y="400.0" font-size="32" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">24 volts</text>
<text x="194.0" y="440.0" font-size="15" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Capacity stays the same.</text>
<rect x="410" y="220" width="90" height="54" rx="6" fill="#fff" stroke="#102a43" stroke-width="2"/><rect x="444" y="212" width="22" height="10" fill="#102a43"/><text x="432.0" y="254.0" font-size="20" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">+</text><text x="478.0" y="254.0" font-size="20" text-anchor="middle" fill="#1d4e89" font-weight="bold" font-family="Liberation Sans">−</text>
<rect x="530" y="220" width="90" height="54" rx="6" fill="#fff" stroke="#102a43" stroke-width="2"/><rect x="564" y="212" width="22" height="10" fill="#102a43"/><text x="552.0" y="254.0" font-size="20" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">+</text><text x="598.0" y="254.0" font-size="20" text-anchor="middle" fill="#1d4e89" font-weight="bold" font-family="Liberation Sans">−</text>
<path d="M455 214 H470 V200 H575 V214" fill="none" stroke="#b91c1c" stroke-width="3"/>
<path d="M478 274 H500 V300 H598 V274" fill="none" stroke="#1d4e89" stroke-width="3"/>
<text x="526.0" y="340.0" font-size="15" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">+ to +    and    − to −</text>
<text x="526.0" y="390.0" font-size="28" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Still 12 volts</text>
<text x="526.0" y="430.0" font-size="15" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Ampere-hours add.</text>
<text x="360.0" y="532.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
</svg>