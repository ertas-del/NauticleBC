<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1010" width="600" height="1010" role="img" aria-labelledby="t d">
<title id="t">The four strokes of a diesel engine</title>
<desc id="d">Four small cylinder drawings in order: intake, compression, power, exhaust.</desc>
<rect width="600" height="1010" fill="#ffffff"/>
<text x="300" y="44" font-size="32" text-anchor="middle" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">Four-stroke diesel cycle</text><text x="300" y="78" font-size="24" text-anchor="middle" fill="#5f6b76" font-weight="normal" font-family="Inter, Arial, sans-serif">suck, squeeze, bang, blow</text><rect x="15" y="100" width="570" height="200" rx="12" fill="#f4f7fa" stroke="#9fb3c8" stroke-width="2"/><rect x="75" y="162" width="100" height="58" fill="#cfe8ff"/><path d="M75 162 V268 M175 162 V268" stroke="#16324f" stroke-width="5" fill="none"/><rect x="67" y="150" width="116" height="12" fill="#16324f"/><rect x="77" y="220" width="96" height="22" fill="#8a97a3" stroke="#16324f" stroke-width="3"/><rect x="119" y="242" width="12" height="50" fill="#8a97a3" stroke="#16324f" stroke-width="2"/><line x1="95" y1="136" x2="95" y2="176" stroke="#1b7a35" stroke-width="5"/><rect x="82" y="176" width="26" height="6" fill="#1b7a35"/><line x1="155" y1="136" x2="155" y2="162" stroke="#c62828" stroke-width="5"/><rect x="142" y="162" width="26" height="6" fill="#c62828"/><text x="95" y="128" font-size="20" text-anchor="middle" fill="#1b7a35" font-weight="bold" font-family="Inter, Arial, sans-serif">IN</text><text x="155" y="128" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold" font-family="Inter, Arial, sans-serif">EX</text><line x1="209" y1="183" x2="209" y2="238" stroke="#16324f" stroke-width="6"/><polygon points="197,238 221,238 209,260" fill="#16324f"/><text x="245" y="160" font-size="30" text-anchor="start" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">1. Intake</text><text x="245" y="205" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Piston moves down.</text><text x="245" y="237" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Inlet valve open.</text><text x="245" y="269" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Air is drawn in.</text><rect x="15" y="315" width="570" height="200" rx="12" fill="#f4f7fa" stroke="#9fb3c8" stroke-width="2"/><rect x="75" y="377" width="100" height="26" fill="#7fb2e5"/><path d="M75 377 V483 M175 377 V483" stroke="#16324f" stroke-width="5" fill="none"/><rect x="67" y="365" width="116" height="12" fill="#16324f"/><rect x="77" y="403" width="96" height="22" fill="#8a97a3" stroke="#16324f" stroke-width="3"/><rect x="119" y="425" width="12" height="82" fill="#8a97a3" stroke="#16324f" stroke-width="2"/><line x1="95" y1="351" x2="95" y2="377" stroke="#1b7a35" stroke-width="5"/><rect x="82" y="377" width="26" height="6" fill="#1b7a35"/><line x1="155" y1="351" x2="155" y2="377" stroke="#c62828" stroke-width="5"/><rect x="142" y="377" width="26" height="6" fill="#c62828"/><text x="95" y="343" font-size="20" text-anchor="middle" fill="#1b7a35" font-weight="bold" font-family="Inter, Arial, sans-serif">IN</text><text x="155" y="343" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold" font-family="Inter, Arial, sans-serif">EX</text><line x1="209" y1="473" x2="209" y2="418" stroke="#16324f" stroke-width="6"/><polygon points="197,418 221,418 209,396" fill="#16324f"/><text x="245" y="375" font-size="30" text-anchor="start" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">2. Compression</text><text x="245" y="420" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Piston moves up.</text><text x="245" y="452" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Both valves closed.</text><text x="245" y="484" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Air is squeezed and hot.</text><rect x="15" y="530" width="570" height="200" rx="12" fill="#f4f7fa" stroke="#9fb3c8" stroke-width="2"/><rect x="75" y="592" width="100" height="58" fill="#ffb74d"/><path d="M75 592 V698 M175 592 V698" stroke="#16324f" stroke-width="5" fill="none"/><rect x="67" y="580" width="116" height="12" fill="#16324f"/><rect x="77" y="650" width="96" height="22" fill="#8a97a3" stroke="#16324f" stroke-width="3"/><rect x="119" y="672" width="12" height="50" fill="#8a97a3" stroke="#16324f" stroke-width="2"/><line x1="95" y1="566" x2="95" y2="592" stroke="#1b7a35" stroke-width="5"/><rect x="82" y="592" width="26" height="6" fill="#1b7a35"/><line x1="155" y1="566" x2="155" y2="592" stroke="#c62828" stroke-width="5"/><rect x="142" y="592" width="26" height="6" fill="#c62828"/><text x="95" y="558" font-size="20" text-anchor="middle" fill="#1b7a35" font-weight="bold" font-family="Inter, Arial, sans-serif">IN</text><text x="155" y="558" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold" font-family="Inter, Arial, sans-serif">EX</text><line x1="125" y1="566" x2="125" y2="614" stroke="#333" stroke-width="4"/><polygon points="118,608 132,608 125,620" fill="#333"/><text x="129" y="642" font-size="18" text-anchor="middle" fill="#333" font-weight="normal" font-family="Inter, Arial, sans-serif">fuel</text><line x1="209" y1="613" x2="209" y2="668" stroke="#16324f" stroke-width="6"/><polygon points="197,668 221,668 209,690" fill="#16324f"/><text x="245" y="590" font-size="30" text-anchor="start" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">3. Power</text><text x="245" y="635" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Fuel is injected and burns.</text><text x="245" y="667" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Both valves closed.</text><text x="245" y="699" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Piston is pushed down.</text><rect x="15" y="745" width="570" height="200" rx="12" fill="#f4f7fa" stroke="#9fb3c8" stroke-width="2"/><rect x="75" y="807" width="100" height="26" fill="#c9c9c9"/><path d="M75 807 V913 M175 807 V913" stroke="#16324f" stroke-width="5" fill="none"/><rect x="67" y="795" width="116" height="12" fill="#16324f"/><rect x="77" y="833" width="96" height="22" fill="#8a97a3" stroke="#16324f" stroke-width="3"/><rect x="119" y="855" width="12" height="82" fill="#8a97a3" stroke="#16324f" stroke-width="2"/><line x1="95" y1="781" x2="95" y2="807" stroke="#1b7a35" stroke-width="5"/><rect x="82" y="807" width="26" height="6" fill="#1b7a35"/><line x1="155" y1="781" x2="155" y2="821" stroke="#c62828" stroke-width="5"/><rect x="142" y="821" width="26" height="6" fill="#c62828"/><text x="95" y="773" font-size="20" text-anchor="middle" fill="#1b7a35" font-weight="bold" font-family="Inter, Arial, sans-serif">IN</text><text x="155" y="773" font-size="20" text-anchor="middle" fill="#c62828" font-weight="bold" font-family="Inter, Arial, sans-serif">EX</text><line x1="209" y1="903" x2="209" y2="848" stroke="#16324f" stroke-width="6"/><polygon points="197,848 221,848 209,826" fill="#16324f"/><text x="245" y="805" font-size="30" text-anchor="start" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">4. Exhaust</text><text x="245" y="850" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Piston moves up.</text><text x="245" y="882" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Exhaust valve open.</text><text x="245" y="914" font-size="23" text-anchor="start" fill="#16324f" font-weight="normal" font-family="Inter, Arial, sans-serif">Burnt gas is pushed out.</text><text x="300" y="985" font-size="26" text-anchor="middle" fill="#16324f" font-weight="bold" font-family="Inter, Arial, sans-serif">4 strokes = 2 turns of the crankshaft</text>
</svg>
