<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="freshG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#1d4e89"/>
</linearGradient>
<linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
</linearGradient>
<linearGradient id="thin" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#292524"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/>
</linearGradient>
</defs>
<rect width="720" height="690" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="690" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Cooling</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Two loops. Only the sea water leaves the boat.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="36" y="128" width="300" height="470" rx="18" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#s)"/>
<rect x="384" y="128" width="300" height="470" rx="18" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5" filter="url(#s)"/>
<text x="186.0" y="164.0" font-size="24" text-anchor="middle" fill="#1d4e89" font-weight="bold" font-family="Liberation Sans">Fresh water</text>
<text x="186.0" y="190.0" font-size="15" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">stays in the engine</text>
<text x="534.0" y="164.0" font-size="24" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Sea water</text>
<text x="534.0" y="190.0" font-size="15" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">takes the heat out</text>
<rect x="56" y="214" width="248" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="56" y="222" width="8" height="62" rx="4" fill="#1d4e89"/>
<text x="184.0" y="250.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Engine</text>
<text x="184.0" y="274.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">block and head</text>
<rect x="56" y="318" width="248" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="56" y="326" width="8" height="62" rx="4" fill="#1d4e89"/>
<text x="184.0" y="354.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Thermostat</text>
<text x="184.0" y="378.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">opens when warm</text>
<rect x="56" y="480" width="248" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="56" y="488" width="8" height="62" rx="4" fill="#1d4e89"/>
<text x="184.0" y="516.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Pump</text>
<text x="184.0" y="540.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">moves the coolant</text>
<rect x="404" y="214" width="248" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="404" y="222" width="8" height="62" rx="4" fill="#0f766e"/>
<text x="532.0" y="250.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Seacock</text>
<text x="532.0" y="274.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">valve in the hull</text>
<rect x="404" y="318" width="248" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="404" y="326" width="8" height="62" rx="4" fill="#0f766e"/>
<text x="532.0" y="354.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Strainer</text>
<text x="532.0" y="378.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">catches weed</text>
<rect x="404" y="480" width="248" height="78" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="404" y="488" width="8" height="62" rx="4" fill="#0f766e"/>
<text x="532.0" y="516.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Impeller</text>
<text x="532.0" y="540.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">never run it dry</text>
<line x1="180.0" y1="292.0" x2="180.0" y2="305.0" stroke="#1d4e89" stroke-width="3.2" stroke-linecap="round"/><polygon points="180.0,318.0 186.5,305.0 173.5,305.0" fill="#1d4e89"/>
<line x1="180.0" y1="396.0" x2="180.0" y2="467.0" stroke="#1d4e89" stroke-width="3.2" stroke-linecap="round"/><polygon points="180.0,480.0 186.5,467.0 173.5,467.0" fill="#1d4e89"/>
<line x1="528.0" y1="292.0" x2="528.0" y2="305.0" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round"/><polygon points="528.0,318.0 534.5,305.0 521.5,305.0" fill="#0f766e"/>
<line x1="528.0" y1="396.0" x2="528.0" y2="467.0" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round"/><polygon points="528.0,480.0 534.5,467.0 521.5,467.0" fill="#0f766e"/>
<rect x="210" y="400" width="300" height="86" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#s)"/>
<text x="360.0" y="436.0" font-size="22" text-anchor="middle" fill="#c05621" font-weight="bold" font-family="Liberation Sans">Heat exchanger</text>
<text x="360.0" y="462.0" font-size="15" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">heat crosses here</text>
<text x="360.0" y="628.0" font-size="18" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">Do not open a hot pressure cap.</text>
<text x="360.0" y="662.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
</svg>