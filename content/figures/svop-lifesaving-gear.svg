<line x1="253" y1="314" x2="253" y2="474" stroke="#d9e2ec" stroke-width="1.5"/>
<line x1="467" y1="314" x2="467" y2="474" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="147" y="428" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Immersion suit</text>
<text x="147" y="450" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Full survival suit,</text>
<text x="147" y="472" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">to abandon ship</text>
<text x="360" y="428" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Anti-exposure</text>
<text x="360" y="450" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">work suit</text>
<text x="360" y="472" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Worn while working</text>
<text x="573" y="428" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Fire extinguisher</text>
<text x="573" y="450" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Check monthly: pin,</text>
<text x="573" y="472" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">seal, gauge in green</text>
<rect x="40" y="506" width="640" height="246" rx="12" fill="#ffffff" filter="url(#s)"/>
<text x="60" y="536" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Flares</text>
<text x="124" y="536" font-size="17" text-anchor="start" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">for distress only</text>
