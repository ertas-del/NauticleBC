<g transform="translate(100,172) scale(0.8) translate(0,0)"><path d="M-36,-38 Q0,-60 36,-38 L44,40 Q40,50 8,50 L4,-12 L-4,-12 L-8,50 Q-40,50 -44,40 Z" fill="#f97316" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><ellipse cx="0" cy="-30" rx="17" ry="13" fill="#ffffff" stroke="#111827" stroke-width="2"/><rect x="-38" y="8" width="28" height="7" fill="#e5e7eb" stroke="#64748b" stroke-width="1"/><rect x="10" y="8" width="28" height="7" fill="#e5e7eb" stroke="#64748b" stroke-width="1"/><line x1="-44" y1="30" x2="44" y2="30" stroke="#1f2937" stroke-width="4"/><rect x="-7" y="25" width="14" height="10" rx="2" fill="#1f2937"/></g>
<text x="158" y="158" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Lifejacket</text>
<text x="158" y="182" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Turns an unconscious</text>
<text x="158" y="204" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">person face up</text>
<line x1="360" y1="134" x2="360" y2="216" stroke="#d9e2ec" stroke-width="1.5"/>
<g transform="translate(420,172) scale(0.8) translate(0,0)"><path d="M-6,-44 L-20,-44 Q-24,-26 -42,-20 L-42,48 L-4,48 L-4,-10 Q-4,-30 -6,-44 Z" fill="#dc2626" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><path d="M6,-44 L20,-44 Q24,-26 42,-20 L42,48 L4,48 L4,-10 Q4,-30 6,-44 Z" fill="#dc2626" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><line x1="0" y1="-8" x2="0" y2="48" stroke="#1f2937" stroke-width="3" stroke-dasharray="3 2"/><line x1="-42" y1="12" x2="42" y2="12" stroke="#1e3a8a" stroke-width="4"/><line x1="-42" y1="32" x2="42" y2="32" stroke="#1e3a8a" stroke-width="4"/><rect x="-7" y="7" width="14" height="10" rx="2" fill="#1f2937"/><rect x="-7" y="27" width="14" height="10" rx="2" fill="#1f2937"/></g>
<text x="478" y="158" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">PFD</text>
<text x="478" y="182" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Less buoyancy; may not</text>
<text x="478" y="204" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">turn you face up</text>
<line x1="60" y1="226" x2="660" y2="226" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="360" y="256" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Required on commercial boats; a PFD only if worn and approved</text>
