<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" role="img">
<title>Lifesaving gear on board</title>
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d4eef7"/><stop offset="1" stop-color="#a9d8ea"/>
</linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
</marker>
<marker id="ahd" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
</marker>
</defs>
<rect width="720" height="800" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="800" fill="#0f766e"/>
<text x="40" y="52" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Lifesaving gear on board</text>
<text x="40" y="82" font-size="18" text-anchor="start" fill="#627d98" font-family="Liberation Sans">Know what each item does. Keep it working and easy to reach.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>

<rect x="40" y="116" width="640" height="226" rx="12" fill="#ffffff" filter="url(#s)"/>
<path d="M111,142 Q147,120 183,142 L191,220 Q187,230 155,230 L151,168 L143,168 L139,230 Q107,230 103,220 Z" fill="#f97316" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><ellipse cx="147" cy="150" rx="17" ry="13" fill="#ffffff" stroke="#111827" stroke-width="2"/><rect x="109" y="188" width="28" height="7" fill="#e5e7eb" stroke="#64748b" stroke-width="1"/><rect x="157" y="188" width="28" height="7" fill="#e5e7eb" stroke="#64748b" stroke-width="1"/><line x1="103" y1="210" x2="191" y2="210" stroke="#1f2937" stroke-width="4"/><rect x="140" y="205" width="14" height="10" rx="2" fill="#1f2937"/>
<path d="M354,136 L340,136 Q336,154 318,160 L318,228 L356,228 L356,170 Q356,150 354,136 Z" fill="#dc2626" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><path d="M366,136 L380,136 Q384,154 402,160 L402,228 L364,228 L364,170 Q364,150 366,136 Z" fill="#dc2626" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><line x1="360" y1="172" x2="360" y2="228" stroke="#1f2937" stroke-width="3" stroke-dasharray="3 2"/><line x1="318" y1="192" x2="402" y2="192" stroke="#1e3a8a" stroke-width="4"/><line x1="318" y1="212" x2="402" y2="212" stroke="#1e3a8a" stroke-width="4"/><rect x="353" y="187" width="14" height="10" rx="2" fill="#1f2937"/><rect x="353" y="207" width="14" height="10" rx="2" fill="#1f2937"/>
<path d="M551,162 L527,204 L537,210 L555,184 Z" fill="#ea580c" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><path d="M595,162 L619,204 L609,210 L591,184 Z" fill="#ea580c" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><path d="M551,158 L595,158 L595,232 L577,232 L573,202 L569,232 L551,232 Z" fill="#ea580c" stroke="#111827" stroke-width="2" stroke-linejoin="round"/><circle cx="573" cy="144" r="17" fill="#ea580c" stroke="#111827" stroke-width="2"/><ellipse cx="573" cy="146" rx="9" ry="10" fill="#f2c9a0" stroke="#111827" stroke-width="1.5"/><line x1="573" y1="162" x2="573" y2="198" stroke="#1f2937" stroke-width="2"/><rect x="551" y="210" width="44" height="6" fill="#e5e7eb"/><circle cx="530" cy="210" r="7" fill="#ea580c" stroke="#111827" stroke-width="2"/><circle cx="616" cy="210" r="7" fill="#ea580c" stroke="#111827" stroke-width="2"/>
<line x1="253" y1="136" x2="253" y2="322" stroke="#d9e2ec" stroke-width="1.5"/>
<line x1="467" y1="136" x2="467" y2="322" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="147" y="264" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Lifejacket</text>
<text x="147" y="288" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Turns an unconscious</text>
<text x="147" y="310" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">person face up</text>
<text x="360" y="264" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">PFD</text>
<text x="360" y="288" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Keeps you afloat, does</text>
<text x="360" y="310" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">not turn you over</text>
<text x="573" y="264" font-size="19" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Anti-exposure suit</text>
<text x="573" y="288" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Protects you in</text>
<text x="573" y="310" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">cold water</text>
<rect x="40" y="356" width="640" height="128" rx="12" fill="#ffffff" filter="url(#s)"/>
<path d="M102,382 Q116,384 120,396 Q122,410 118,440" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
<rect x="70" y="390" width="40" height="80" rx="12" fill="#dc2626" stroke="#111827" stroke-width="2"/>
<rect x="80" y="378" width="20" height="14" rx="2" fill="#1f2937"/>
<path d="M84,378 L66,368 L70,364 L92,374 Z" fill="#475569" stroke="#111827" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="104" cy="380" r="5" fill="none" stroke="#facc15" stroke-width="3"/>
<circle cx="90" cy="412" r="10" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<path d="M83,408 A8,8 0 0 1 97,408" fill="none" stroke="#16a34a" stroke-width="3"/>
<line x1="90" y1="413" x2="95" y2="406" stroke="#111827" stroke-width="1.5"/>
<rect x="76" y="430" width="28" height="22" rx="2" fill="#ffffff"/>
<text x="150" y="390" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Fire extinguishers</text>
<text x="150" y="416" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Check monthly: pin and seal on, gauge in the green.</text>
<text x="150" y="440" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Know each one's class and where it is.</text>
<text x="150" y="464" font-size="16" text-anchor="start" fill="#102a43" font-family="Liberation Sans">Test smoke and heat alarms too.</text>
<rect x="40" y="498" width="640" height="254" rx="12" fill="#ffffff" filter="url(#s)"/>
<text x="60" y="530" font-size="19" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Flares</text>
<text x="124" y="530" font-size="17" text-anchor="start" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">for distress only</text>
<circle cx="147" cy="562" r="20" fill="#fca5a5" opacity="0.55"/>
<path d="M147,546 C156,556 157,566 153,574 L141,574 C137,566 139,556 147,546 Z" fill="#ef4444"/>
<path d="M147,558 C151,564 151,570 149,574 L145,574 C143,570 144,564 147,558 Z" fill="#fef08a"/>
<rect x="140" y="574" width="14" height="38" rx="2" fill="#dc2626" stroke="#111827" stroke-width="1.5"/>
<rect x="139" y="610" width="16" height="22" rx="3" fill="#1f2937"/>
<path d="M330,566 Q360,530 390,566 Z" fill="#f8fafc" stroke="#111827" stroke-width="1.8"/>
<path d="M330,566 L360,596 L390,566 M350,566 L360,596 L370,566" fill="none" stroke="#64748b" stroke-width="1.2"/>
<circle cx="360" cy="604" r="13" fill="#fca5a5" opacity="0.6"/>
<circle cx="360" cy="604" r="7" fill="#ef4444"/>
<path d="M310,632 Q316,590 326,556" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ah)"/>
<rect x="527" y="620" width="92" height="12" rx="4" fill="#a9d8ea"/>
<circle cx="559" cy="604" r="11" fill="#fb923c" opacity="0.8"/>
<circle cx="571" cy="590" r="13" fill="#fb923c" opacity="0.8"/>
<circle cx="587" cy="576" r="14" fill="#fb923c" opacity="0.8"/>
<circle cx="603" cy="560" r="13" fill="#fb923c" opacity="0.8"/>
<circle cx="577" cy="568" r="10" fill="#fb923c" opacity="0.8"/>
<rect x="547" y="604" width="24" height="22" rx="4" fill="#f97316" stroke="#111827" stroke-width="1.5"/>
<text x="147" y="658" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Hand-held red</text>
<text x="147" y="680" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Day or night,</text>
<text x="147" y="700" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">shows your position</text>
<text x="360" y="658" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Red parachute rocket</text>
<text x="360" y="680" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Goes high, seen</text>
<text x="360" y="700" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">from a long way</text>
<text x="573" y="658" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Orange smoke</text>
<text x="573" y="680" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Daytime, hand-held</text>
<text x="573" y="700" font-size="16" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">or floating</text>
<line x1="60" y1="714" x2="660" y2="714" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="360" y="738" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Store dry  ·  Check the date  ·  Dispose of old flares properly</text>
<text x="360" y="772" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
