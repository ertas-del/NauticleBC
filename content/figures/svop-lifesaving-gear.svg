<text x="130" y="644" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">Type A</text>
<text x="130" y="666" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Rocket parachute</text>
<text x="130" y="686" font-size="15" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Red, goes high</text>
<text x="284" y="644" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">Type B</text>
<text x="284" y="666" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Multi-star</text>
<text x="284" y="686" font-size="15" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Red stars</text>
<text x="438" y="644" font-size="18" text-anchor="middle" fill="#dc2626" font-weight="bold" font-family="Liberation Sans">Type C</text>
<text x="438" y="666" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Hand flare</text>
<text x="438" y="686" font-size="15" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Red, day or night</text>
<text x="590" y="644" font-size="18" text-anchor="middle" fill="#ea580c" font-weight="bold" font-family="Liberation Sans">Type D</text>
<text x="590" y="666" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Orange smoke</text>
<text x="590" y="686" font-size="15" text-anchor="middle" fill="#102a43" font-family="Liberation Sans">Daytime only</text>
<line x1="60" y1="700" x2="660" y2="700" stroke="#d9e2ec" stroke-width="1.5"/>
<text x="360" y="728" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Flares expire 4 years after manufacture  ·  Store dry  ·  Dispose of old flares properly</text>
<text x="360" y="772" font-size="14" text-anchor="middle" fill="#627d98" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
