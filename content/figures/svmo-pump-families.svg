<rect width="720" height="620" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="620" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Two pump families</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">A positive displacement pump needs a relief valve.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="36" y="130" width="316" height="430" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="368" y="130" width="316" height="430" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<text x="194.0" y="172.0" font-size="24" text-anchor="middle" fill="#1d4e89" font-weight="bold" font-family="Liberation Sans">Centrifugal</text>
<text x="526.0" y="172.0" font-size="22" text-anchor="middle" fill="#c05621" font-weight="bold" font-family="Liberation Sans">Positive displacement</text>
<circle cx="194" cy="300" r="70" fill="#eff6ff" stroke="#1d4e89" stroke-width="3"/>
<circle cx="194" cy="300" r="16" fill="#1d4e89"/>
<line x1="194.0" y1="300.0" x2="236.3" y2="315.4" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round"/><polygon points="248.5,319.8 238.5,309.3 234.1,321.5" fill="#1d4e89"/>
<line x1="194.0" y1="300.0" x2="178.6" y2="342.3" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round"/><polygon points="174.2,354.5 184.7,344.5 172.5,340.1" fill="#1d4e89"/>
<line x1="194.0" y1="300.0" x2="151.7" y2="284.6" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round"/><polygon points="139.5,280.2 149.5,290.7 153.9,278.5" fill="#1d4e89"/>
<line x1="194.0" y1="300.0" x2="209.4" y2="257.7" stroke="#1d4e89" stroke-width="2.4" stroke-linecap="round"/><polygon points="213.8,245.5 203.3,255.5 215.5,259.9" fill="#1d4e89"/>
<text x="194.0" y="410.0" font-size="16" text-anchor="middle" fill="#243b53" font-weight="normal" font-family="Liberation Sans">Throws liquid outward.</text>
<text x="194.0" y="436.0" font-size="16" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Not self-priming.</text>
<text x="194.0" y="470.0" font-size="15" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">High flow, modest pressure.</text>
<circle cx="470" cy="300" r="48" fill="#fff7ed" stroke="#c05621" stroke-width="3"/>
<circle cx="554" cy="300" r="48" fill="#fff7ed" stroke="#c05621" stroke-width="3"/>
<circle cx="470" cy="300" r="10" fill="#c05621"/>
<circle cx="554" cy="300" r="10" fill="#c05621"/>
<text x="512.0" y="410.0" font-size="16" text-anchor="middle" fill="#243b53" font-weight="normal" font-family="Liberation Sans">Traps a fixed volume.</text>
<text x="512.0" y="436.0" font-size="16" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Usually self-priming.</text>
<text x="512.0" y="470.0" font-size="16" text-anchor="middle" fill="#b91c1c" font-weight="bold" font-family="Liberation Sans">Needs a relief valve.</text>
<text x="512.0" y="510.0" font-size="15" text-anchor="middle" fill="#b91c1c" font-weight="normal" font-family="Liberation Sans">Do not dead-head it.</text>
<text x="360.0" y="592.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
</svg>