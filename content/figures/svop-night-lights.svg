<text x="140.0" y="686.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">red over white, all-round</text>
<text x="140.0" y="706.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">+ sidelights and stern light</text>
<text x="140.0" y="726.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">when making way</text>
<path d="M70,584 L212,584 L200,604 L84,604 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<path d="M100,584 L100,560 L150,560 L158,584 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<line x1="170" y1="584" x2="170" y2="482" stroke="#2c4a72" stroke-width="3"/>
<line x1="48" y1="605" x2="232" y2="605" stroke="#2c4a72" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="170" cy="484" r="13" fill="#dc2626" opacity="0.55" filter="url(#glow)"/><circle cx="170" cy="484" r="5.5" fill="#dc2626"/><circle cx="170" cy="484" r="2.5" fill="#ffffff" opacity="0.85"/>
<circle cx="170" cy="518" r="13" fill="#ffffff" opacity="0.55" filter="url(#glow)"/><circle cx="170" cy="518" r="5.5" fill="#ffffff"/><circle cx="170" cy="518" r="2.5" fill="#ffffff" opacity="0.85"/>
</g>
