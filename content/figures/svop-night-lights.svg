<text x="596.0" y="666.0" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">(g) Restricted in ability</text>
<text x="596.0" y="686.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">to manoeuvre: red, white,</text>
<text x="596.0" y="706.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">red, all-round, vertical</text>
<path d="M526,584 L668,584 L656,604 L540,604 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<path d="M556,584 L556,560 L606,560 L614,584 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<line x1="626" y1="584" x2="626" y2="482" stroke="#2c4a72" stroke-width="3"/>
<line x1="504" y1="605" x2="688" y2="605" stroke="#2c4a72" stroke-width="1.5" stroke-dasharray="5 6"/>
