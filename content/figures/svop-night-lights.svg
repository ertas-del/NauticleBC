<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1124" width="720" height="1124" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="nightP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1d36"/><stop offset="1" stop-color="#12294a"/></linearGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="720" height="1124" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="1124" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">What you see at night</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">In the dark you see only the lights. Learn each pattern.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="40" y="118" width="200" height="200" rx="10" fill="url(#nightP)" filter="url(#s)"/>
<text x="140.0" y="342.0" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">(a) Power-driven</text>
<text x="140.0" y="362.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">under 12 m, from ahead:</text>
<text x="140.0" y="382.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">all-round white over</text>
<text x="140.0" y="402.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">green and red sidelights</text>
<path d="M82,258 L198,258 L170,283 L110,283 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<path d="M114,258 L114,230 L166,230 L166,258 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
