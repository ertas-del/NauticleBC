<text x="368.0" y="666.0" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">(f) Not under command</text>
<text x="368.0" y="686.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">red over red, all-round</text>
<text x="368.0" y="706.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">in a vertical line</text>
<path d="M298,584 L440,584 L428,604 L312,604 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<path d="M328,584 L328,560 L378,560 L386,584 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<line x1="398" y1="584" x2="398" y2="482" stroke="#2c4a72" stroke-width="3"/>
<line x1="276" y1="605" x2="460" y2="605" stroke="#2c4a72" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="398" cy="484" r="13" fill="#dc2626" opacity="0.55" filter="url(#glow)"/><circle cx="398" cy="484" r="5.5" fill="#dc2626"/><circle cx="398" cy="484" r="2.5" fill="#ffffff" opacity="0.85"/>
<circle cx="398" cy="518" r="13" fill="#dc2626" opacity="0.55" filter="url(#glow)"/><circle cx="398" cy="518" r="5.5" fill="#dc2626"/><circle cx="398" cy="518" r="2.5" fill="#ffffff" opacity="0.85"/>
</g>
<g transform="translate(-456 324)">
