<line x1="48" y1="281" x2="232" y2="281" stroke="#2c4a72" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="140" cy="166" r="13" fill="#ffffff" opacity="0.55" filter="url(#glow)"/><circle cx="140" cy="166" r="5.5" fill="#ffffff"/><circle cx="140" cy="166" r="2.5" fill="#ffffff" opacity="0.85"/>
<circle cx="96" cy="246" r="13" fill="#16a34a" opacity="0.55" filter="url(#glow)"/><circle cx="96" cy="246" r="5.5" fill="#16a34a"/><circle cx="96" cy="246" r="2.5" fill="#ffffff" opacity="0.85"/>
<circle cx="184" cy="246" r="13" fill="#dc2626" opacity="0.55" filter="url(#glow)"/><circle cx="184" cy="246" r="5.5" fill="#dc2626"/><circle cx="184" cy="246" r="2.5" fill="#ffffff" opacity="0.85"/>
<rect x="268" y="118" width="200" height="200" rx="10" fill="url(#nightP)" filter="url(#s)"/>
<text x="368.0" y="342.0" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">(b) Power-driven, 12 m+</text>
<text x="368.0" y="362.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">from her starboard side:</text>
<text x="368.0" y="382.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">masthead white, green</text>
<text x="368.0" y="402.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">sidelight; no stern light</text>
<path d="M298,260 L440,260 L428,280 L312,280 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<path d="M328,260 L328,236 L378,236 L386,260 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
