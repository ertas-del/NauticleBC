<circle cx="626" cy="512" r="13" fill="#ffffff" opacity="0.55" filter="url(#glow)"/><circle cx="626" cy="512" r="5.5" fill="#ffffff"/><circle cx="626" cy="512" r="2.5" fill="#ffffff" opacity="0.85"/>
<circle cx="626" cy="544" r="13" fill="#dc2626" opacity="0.55" filter="url(#glow)"/><circle cx="626" cy="544" r="5.5" fill="#dc2626"/><circle cx="626" cy="544" r="2.5" fill="#ffffff" opacity="0.85"/>
</g>
<rect x="268" y="766" width="428" height="200" rx="10" fill="#ffffff" filter="url(#s)"/>
<text x="292" y="804" font-size="18" text-anchor="start" fill="#0f766e" font-weight="bold" font-family="Liberation Sans">Fishing lights: say it out loud</text>
<circle cx="304" cy="840" r="9" fill="#16a34a"/><circle cx="304" cy="864" r="9" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.5"/>
<text x="328" y="846" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Green over white:</text>
<text x="328" y="868" font-size="16" text-anchor="start" fill="#486581" font-family="Liberation Sans">trawling</text>
<circle cx="304" cy="902" r="9" fill="#dc2626"/><circle cx="304" cy="926" r="9" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.5"/>
<text x="328" y="908" font-size="17" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Red over white:</text>
<text x="328" y="930" font-size="16" text-anchor="start" fill="#486581" font-family="Liberation Sans">other fishing, like seining or gillnetting</text>
<text x="360.0" y="1074.0" font-size="15" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Panels (f) and (g) show the signal lights only, as seen when not making way.</text>
<text x="360.0" y="1100.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not for navigation.</text>
</svg>
