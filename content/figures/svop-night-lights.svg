<circle cx="372" cy="248" r="13" fill="#16a34a" opacity="0.55" filter="url(#glow)"/><circle cx="372" cy="248" r="5.5" fill="#16a34a"/><circle cx="372" cy="248" r="2.5" fill="#ffffff" opacity="0.85"/>
<rect x="496" y="118" width="200" height="200" rx="10" fill="url(#nightP)" filter="url(#s)"/>
<text x="596.0" y="342.0" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">(c) At anchor</text>
<text x="596.0" y="362.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">one all-round white light</text>
<text x="596.0" y="382.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">where best seen</text>
<path d="M526,260 L668,260 L656,280 L540,280 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<path d="M556,260 L556,236 L606,236 L614,260 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<line x1="626" y1="260" x2="626" y2="158" stroke="#2c4a72" stroke-width="3"/>
<line x1="504" y1="281" x2="688" y2="281" stroke="#2c4a72" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="626" cy="160" r="13" fill="#ffffff" opacity="0.55" filter="url(#glow)"/><circle cx="626" cy="160" r="5.5" fill="#ffffff"/><circle cx="626" cy="160" r="2.5" fill="#ffffff" opacity="0.85"/>
<rect x="40" y="442" width="200" height="200" rx="10" fill="url(#nightP)" filter="url(#s)"/>
<text x="140.0" y="666.0" font-size="17" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">(d) Trawling</text>
<text x="140.0" y="686.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">green over white, all-round</text>
<text x="140.0" y="706.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">+ sidelights and stern light</text>
<text x="140.0" y="726.0" font-size="16" text-anchor="middle" fill="#486581" font-weight="normal" font-family="Liberation Sans">when making way</text>
<path d="M70,584 L212,584 L200,604 L84,604 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<path d="M100,584 L100,560 L150,560 L158,584 Z" fill="#1f3a5f" stroke="#2c4a72" stroke-width="1.5"/>
<line x1="170" y1="584" x2="170" y2="482" stroke="#2c4a72" stroke-width="3"/>
<line x1="48" y1="605" x2="232" y2="605" stroke="#2c4a72" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="170" cy="484" r="13" fill="#16a34a" opacity="0.55" filter="url(#glow)"/><circle cx="170" cy="484" r="5.5" fill="#16a34a"/><circle cx="170" cy="484" r="2.5" fill="#ffffff" opacity="0.85"/>
<circle cx="170" cy="518" r="13" fill="#ffffff" opacity="0.55" filter="url(#glow)"/><circle cx="170" cy="518" r="5.5" fill="#ffffff"/><circle cx="170" cy="518" r="2.5" fill="#ffffff" opacity="0.85"/>
