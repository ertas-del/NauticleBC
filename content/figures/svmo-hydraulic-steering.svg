<text x="662.0" y="430.0" font-size="16" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Rudder</text>
<text x="360.0" y="470.0" font-size="18" text-anchor="middle" fill="#243b53" font-weight="normal" font-family="Liberation Sans">Air in the oil makes the helm spongy. Bleed it.</text>
<text x="360.0" y="512.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
