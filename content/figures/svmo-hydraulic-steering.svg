<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Hydraulic steering</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">The wheel moves oil. The oil moves the rudder.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<circle cx="110" cy="280" r="62" fill="#ffffff" stroke="#102a43" stroke-width="8" filter="url(#s)"/>
