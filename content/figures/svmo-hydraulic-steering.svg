<text x="110.0" y="380.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Helm</text>
<rect x="210" y="246" width="150" height="72" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="210" y="254" width="8" height="56" rx="4" fill="#0f766e"/>
<text x="289.0" y="282.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Helm pump</text>
