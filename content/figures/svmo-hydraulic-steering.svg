<line x1="172.0" y1="280.0" x2="197.0" y2="280.0" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round"/><polygon points="210.0,280.0 197.0,273.5 197.0,286.5" fill="#0f766e"/>
<path d="M360 262 C430 262 430 230 500 230" fill="none" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/>
<path d="M360 302 C430 302 430 340 500 340" fill="none" stroke="#1d4e89" stroke-width="6" stroke-linecap="round"/>
<text x="430.0" y="200.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">two pipes</text>
<rect x="500" y="248" width="160" height="78" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#s)"/>
