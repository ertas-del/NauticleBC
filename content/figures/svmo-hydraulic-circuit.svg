<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" width="720" height="680" role="img">
<defs>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity="0.10"/>
</filter>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#e7eef3"/>
</linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/>
</linearGradient>
<linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0e7490"/>
</linearGradient>
<linearGradient id="freshG" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#1d4e89"/>
</linearGradient>
<linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/>
</linearGradient>
<linearGradient id="thin" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#78716c"/><stop offset="1" stop-color="#292524"/>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#94a3b8"/>
</linearGradient>
</defs>
<rect width="720" height="680" rx="0" fill="url(#paper)"/>
<rect x="0" y="0" width="10" height="680" fill="#0f766e"/>
<text x="40.0" y="52.0" font-size="32" text-anchor="start" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Hydraulic circuit</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Oil does not compress, so force arrives at once.</text>
<line x1="40" y1="100" x2="680" y2="100" stroke="#d9e2ec" stroke-width="1.5"/>
<rect x="36" y="180" width="190" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="36" y="188" width="8" height="68" rx="4" fill="#0f766e"/>
<text x="135.0" y="216.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Reservoir</text>
<text x="135.0" y="240.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">keep it closed</text>
<rect x="276" y="180" width="168" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="276" y="188" width="8" height="68" rx="4" fill="#c05621"/>
<text x="364.0" y="216.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Pump</text>
<text x="364.0" y="240.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">makes flow</text>
<line x1="226.0" y1="222.0" x2="263.0" y2="222.0" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round"/><polygon points="276.0,222.0 263.0,215.5 263.0,228.5" fill="#0f766e"/>
<rect x="494" y="180" width="190" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="494" y="188" width="8" height="68" rx="4" fill="#b91c1c"/>
<text x="593.0" y="216.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Relief valve</text>
<text x="593.0" y="240.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">oil returns to the tank</text>
<line x1="444.0" y1="222.0" x2="481.0" y2="222.0" stroke="#c05621" stroke-width="3.2" stroke-linecap="round"/><polygon points="494.0,222.0 481.0,215.5 481.0,228.5" fill="#c05621"/>
<rect x="276" y="340" width="168" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="276" y="348" width="8" height="68" rx="4" fill="#1d4e89"/>
<text x="364.0" y="376.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Control valve</text>
<text x="364.0" y="400.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">picks the direction</text>
<line x1="360.0" y1="264.0" x2="360.0" y2="327.0" stroke="#c05621" stroke-width="3.2" stroke-linecap="round"/><polygon points="360.0,340.0 366.5,327.0 353.5,327.0" fill="#c05621"/>
<rect x="276" y="490" width="168" height="84" rx="18" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.5" filter="url(#s)"/>
<rect x="276" y="498" width="8" height="68" rx="4" fill="#1d4e89"/>
<text x="364.0" y="526.0" font-size="18" text-anchor="middle" fill="#102a43" font-weight="bold" font-family="Liberation Sans">Cylinder</text>
<text x="364.0" y="550.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">straight-line motion</text>
<line x1="360.0" y1="424.0" x2="360.0" y2="477.0" stroke="#1d4e89" stroke-width="3.2" stroke-linecap="round"/><polygon points="360.0,490.0 366.5,477.0 353.5,477.0" fill="#1d4e89"/>
<text x="360.0" y="620.0" font-size="18" text-anchor="middle" fill="#243b53" font-weight="normal" font-family="Liberation Sans">The pump does not make pressure. Resistance does.</text>
<text x="360.0" y="652.0" font-size="14" text-anchor="middle" fill="#627d98" font-weight="normal" font-family="Liberation Sans">Study drawing. Not a ship plan.</text>
</svg>